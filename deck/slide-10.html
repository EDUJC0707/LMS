<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="slide">
  <div class="head">
    <div>
      <div class="eyebrow">Summary</div>
      <h1>월 비용 총괄</h1>
    </div>
    <img class="logo" src="assets/logo.jpg" alt="EduJC">
  </div>

  <div style="margin-top:52px">
    <table class="tbl" style="font-size:18px">
      <tr><th>항목</th><th>선택</th><th>월 비용</th></tr>
      <tr>
        <td style="font-weight:700">클리닉 화상</td>
        <td>구글 미트 (Business Standard)</td>
        <td style="font-weight:700">$14 × 동시 조교 수 <span style="color:var(--muted);font-weight:600">(≈2만원 × n)</span></td>
      </tr>
      <tr>
        <td style="font-weight:700">문의·상담·전화</td>
        <td>채널톡</td>
        <td style="font-weight:700">5~6만원</td>
      </tr>
      <tr>
        <td style="font-weight:700">영상 호스팅</td>
        <td style="color:var(--b);font-weight:800">← 오늘 결정</td>
        <td style="font-weight:700">0원 (2안) ~ 131만원 (1안 4K)</td>
      </tr>
    </table>
  </div>

  <div style="display:flex;margin-top:56px;margin-left:-40px">
    <div style="flex:1;padding:0 40px;border-left:1px solid var(--hair)">
      <div style="font-size:15px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:12px">2안 YouTube 선택 시</div>
      <div style="font-size:34px;font-weight:800;font-variant-numeric:tabular-nums">월 ~9만원<span style="font-size:17px;color:var(--muted);font-weight:600">&nbsp;(조교 2명 기준)</span></div>
    </div>
    <div style="flex:1;padding:0 40px;border-left:1px solid var(--hair)">
      <div style="font-size:15px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:12px">1안 4K (Mux) 선택 시</div>
      <div style="font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--a)">월 ~140만원<span style="font-size:17px;color:var(--muted);font-weight:600">&nbsp;(조교 2명 기준)</span></div>
    </div>
  </div>

  <div class="take" style="position:absolute;left:96px;right:96px;bottom:70px">
    <span class="bar"></span>
    <span class="txt">차이는 전부 <span class="hl">영상 호스팅 결정</span>에서 나온다</span>
  </div>
</div></body></html>
