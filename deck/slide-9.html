<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="slide">
  <div class="head">
    <div>
      <div class="eyebrow">Channel Talk</div>
      <h1>결석생 전화 상담</h1>
    </div>
    <img class="logo" src="assets/logo.jpg" alt="EduJC">
  </div>

  <div style="display:flex;margin-top:56px;margin-left:-40px">
    <div style="flex:1;padding:0 40px;border-left:1px solid var(--hair)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px">
        <span class="dot b"></span><span style="font-size:21px;font-weight:800;color:var(--b)">지금 (개인 폰)</span>
      </div>
      <div style="font-size:19px;line-height:2.1">통화 기록이 <span class="kw">안 남음</span></div>
      <div style="font-size:19px;line-height:2.1">내용은 <span class="kw">손으로</span> 따로 입력해야 함</div>
      <div style="font-size:19px;line-height:2.1">누가 몇 번 걸었는지 <span class="kw">파악 불가</span></div>
    </div>

    <div style="flex:1.2;padding:0 40px;border-left:1px solid var(--hair)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px">
        <span class="dot a"></span><span style="font-size:21px;font-weight:800;color:var(--a)">채널톡</span>
      </div>
      <div style="font-size:19px;line-height:2.1">LMS 화면에서 <span class="kw">발신</span> (학원 번호)</div>
      <div style="font-size:19px;line-height:2.1"><span class="kw">자동 녹음 + 전사 + AI 요약</span></div>
      <div style="font-size:19px;line-height:2.1">학생별 상담 이력 <span class="kw">자동 기록</span> → LMS 연동</div>
      <div style="font-size:19px;line-height:2.1">결석생 <span class="kw">상담 명단 자동 추출</span> · 통화 횟수 표시</div>
    </div>
  </div>

  <div class="take" style="position:absolute;left:96px;right:96px;bottom:70px">
    <span class="bar"></span>
    <span class="txt">플랜 27,000원 + 번호 5,000원 + 통화료 = <span class="hl">월 5~6만원</span></span>
  </div>
</div></body></html>
