<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="slide">
  <div class="head">
    <div>
      <div class="eyebrow">Video Hosting</div>
      <h1>영상 호스팅 요건</h1>
    </div>
    <img class="logo" src="assets/logo.jpg" alt="EduJC">
  </div>

  <div style="display:flex;margin-top:60px;margin-left:-40px">
    <div style="flex:1.1;padding:0 40px;border-left:1px solid var(--hair)">
      <div style="font-size:14px;font-weight:700;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:24px">Requirements</div>
      <div style="display:flex;gap:16px;padding:13px 0"><span class="idx">01</span><span style="font-size:20px;font-weight:700">다운로드 불가</span></div>
      <div style="display:flex;gap:16px;padding:13px 0"><span class="idx">02</span><span style="font-size:20px;font-weight:700">콘솔로 링크를 찾아도 재생 불가 <span style="color:var(--a)">→ DRM</span></span></div>
      <div style="display:flex;gap:16px;padding:13px 0"><span class="idx">03</span><span style="font-size:20px;font-weight:700">워터마크 <span style="color:var(--muted);font-weight:600">(가점)</span></span></div>
      <div style="display:flex;gap:16px;padding:13px 0"><span class="idx">04</span><span style="font-size:20px;font-weight:700">4K 원본</span></div>
      <div style="display:flex;gap:16px;padding:13px 0"><span class="idx">05</span><span style="font-size:20px;font-weight:700">LMS(웹·앱) 안에서 재생 <span style="color:var(--muted);font-weight:600">(임베드)</span></span></div>
    </div>

    <div style="flex:1;padding:0 40px;border-left:1px solid var(--hair)">
      <div style="font-size:14px;font-weight:700;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:24px">용어</div>
      <div style="margin-bottom:34px">
        <div style="font-size:22px;font-weight:800;margin-bottom:10px">DRM</div>
        <div style="font-size:17px;line-height:1.7;color:var(--muted)">영상 자체를 <span class="kw">암호화</span>. 개발자도구로 주소를 빼내도 재생 불가. 복호화 열쇠는 <span class="kw">로그인한 그 학생·그 기기</span>에만 잠깐 발급.</div>
      </div>
      <div>
        <div style="font-size:22px;font-weight:800;margin-bottom:10px">RPA</div>
        <div style="font-size:17px;line-height:1.7;color:var(--muted)">사람이 하던 반복 클릭을 <span class="kw">봇이 대신</span>. 유튜브에서 학생 계정에 영상 권한 부여/회수를 자동 처리.</div>
      </div>
    </div>
  </div>
</div></body></html>
