<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="slide">
  <div class="head">
    <div>
      <div class="eyebrow">Decision</div>
      <h1>LMS 외부 서비스: 오늘 결정할 것</h1>
    </div>
    <img class="logo" src="assets/logo.jpg" alt="EduJC">
  </div>

  <div style="margin-top:56px">
    <div style="display:flex;align-items:flex-start;gap:26px;padding:26px 0;border-bottom:1px solid var(--hair)">
      <span class="idx" style="font-size:17px;margin-top:3px">01</span>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:14px">
          <span style="font-size:24px;font-weight:800">영상 호스팅</span>
          <span class="badge need">결정 필요</span>
        </div>
        <div style="font-size:18px;color:var(--muted);margin-top:8px;line-height:1.55">
          <span style="color:var(--ink);font-weight:700">1안 DRM 호스팅</span> 월 50~131만원 (임베드·DRM·자동화)
          &nbsp;vs&nbsp; <span style="color:var(--ink);font-weight:700">2안 YouTube RPA</span> 0원 (32계정 한도·임베드 불가)
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:flex-start;gap:26px;padding:26px 0;border-bottom:1px solid var(--hair)">
      <span class="idx" style="font-size:17px;margin-top:3px">02</span>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:14px">
          <span style="font-size:24px;font-weight:800">클리닉 화상</span>
          <span class="badge done">확정 제안</span>
        </div>
        <div style="font-size:18px;color:var(--muted);margin-top:8px">
          구글 미트: 녹화·전사·AI요약 자동 저장 · <span style="color:var(--ink);font-weight:700">$14/월 × 동시 조교 수</span>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:flex-start;gap:26px;padding:26px 0;border-bottom:1px solid var(--hair)">
      <span class="idx" style="font-size:17px;margin-top:3px">03</span>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:14px">
          <span style="font-size:24px;font-weight:800">문의 · 상담 · 전화</span>
          <span class="badge done">확정 제안</span>
        </div>
        <div style="font-size:18px;color:var(--muted);margin-top:8px">
          채널톡: 카톡·인스타·전화를 한 곳에서 · <span style="color:var(--ink);font-weight:700">월 5~6만원</span>
        </div>
      </div>
    </div>
  </div>

  <div class="take" style="position:absolute;left:96px;right:96px;bottom:70px">
    <span class="bar"></span>
    <span class="txt">실질 결정은 하나, <span class="hl">영상 호스팅</span> (1안 vs 2안)</span>
  </div>
</div></body></html>
