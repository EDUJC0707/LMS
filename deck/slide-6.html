<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="slide">
  <div class="head">
    <div>
      <div class="eyebrow">Video Hosting</div>
      <h1>2안: YouTube (RPA)</h1>
    </div>
    <img class="logo" src="assets/logo.jpg" alt="EduJC">
  </div>
  <div class="def">비공개 영상 + 학생 구글 계정별 권한 부여. 권한 작업은 <span class="kw">RPA 봇</span>이 자동 처리</div>

  <div style="display:flex;margin-top:56px;margin-left:-40px">
    <div style="flex:1;padding:0 40px;border-left:1px solid var(--hair)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px">
        <span class="dot a"></span><span style="font-size:21px;font-weight:800;color:var(--a)">되는 것</span>
      </div>
      <div style="font-size:19px;line-height:2.1">비용 <span class="kw">0원</span> · 4K 무료</div>
      <div style="font-size:19px;line-height:2.1">RPA 검증 완료 <span style="color:var(--muted)">(부여·회수 실동작 확인)</span></div>
      <div style="font-size:19px;line-height:2.1">링크 유출돼도 타인 시청 불가 <span style="color:var(--muted)">(계정 귀속)</span></div>
    </div>

    <div style="flex:1;padding:0 40px;border-left:1px solid var(--hair)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px">
        <span class="dot b"></span><span style="font-size:21px;font-weight:800;color:var(--b)">감수할 것</span>
      </div>
      <div style="font-size:19px;line-height:2.1">영상당 <span class="kw">32개 계정</span> 한도 → 100명이면 <span class="kw">사본 4개</span> 분할</div>
      <div style="font-size:19px;line-height:2.1">유튜브 코드 변경 시 공유 중단 <span style="color:var(--muted)">(복구 ~1일)</span></div>
      <div style="font-size:19px;line-height:2.1">LMS 임베드 불가 <span style="color:var(--muted)">(유튜브 이동 + 구글 로그인)</span></div>
      <div style="font-size:19px;line-height:2.1">워터마크 없음</div>
    </div>
  </div>

  <div class="take" style="position:absolute;left:96px;right:96px;bottom:70px">
    <span class="bar"></span>
    <span class="txt">비용 0원이 우선이면 <span class="hl">2안</span> · 임베드·안정성·무제한 계정이 우선이면 <span class="hl">1안</span></span>
  </div>
</div></body></html>
