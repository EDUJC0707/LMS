<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한종철의 통합과학</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  
  :root{
    --ink:#FFFFFF;
    --fg:#14161A;
    --muted:#6A6F78;
    --accent:#3A4A8C;
    --pad: clamp(20px, 4vw, 64px);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--ink); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",
                "Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ── 스크롤 트랙: 이 높이만큼 스크롤하는 동안 히어로가 고정된다 ──── */
  .track{ position:relative; height:250vh; }
  .stage{ position:sticky; top:0; height:100svh; overflow:hidden; }

  /* 레이어 0 — 프레임 시퀀스가 화면 전체를 덮는다 (풀블리드).
     통과가 끝나고 텍스트·사진이 등장하면 확 가라앉는다 — 배경이 글자와 싸우면 안 된다. */
  #seq{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    opacity:calc(1 - var(--reveal,0) * .78);
    transition:opacity .1s linear;
  }

  /* 레이어 1 — 가독성 스크림.
     시퀀스가 밝아지는 구간에서 우측 텍스트가 묻힌다(유튭 영상도 여기서 터졌다).
     우측에서만 배경색이 배어 나오게 해 좌측 그래픽은 손대지 않는다. */
  .scrim{
    position:absolute; inset:0; pointer-events:none; z-index:1;
    background:linear-gradient(
      260deg,   /* 텍스트가 왼쪽에 있으므로 왼쪽에서 배어 나온다 */
      transparent 0%, transparent 34%,
      color-mix(in srgb, var(--ink) 55%, transparent) 58%,
      color-mix(in srgb, var(--ink) 82%, transparent) 100%);
  }

  /* 레이어 2 — 그 위에 얹히는 것들.
     처음엔 포스터처럼 다 보이다가, 스크롤해 들어가기 시작하면 걷힌다.
     이게 없으면 오른쪽에 사진·글이 박힌 채라 '들어간다'는 느낌이 안 난다. */
  .overlay{
    position:absolute; inset:0; z-index:3; display:grid; align-items:center;
    /* 텍스트는 왼쪽, 사진은 오른쪽 — 겹치지 않는다 */
    grid-template-columns: minmax(300px, 52%) 1fr;
    padding: 0 var(--pad); gap: var(--pad);
    pointer-events:none;
    opacity:var(--reveal,1);
    transform:translateX(calc((1 - var(--reveal,1)) * -3vw));
    will-change:opacity,transform;
  }
  .overlay > *{ pointer-events:auto }
  .left{}   /* 사진 자리 — 비워둔다. .teacher가 우측 절대배치로 채운다 */

  .right{ max-width:34rem; }
  h1{
    font-family:"Instrument Serif",serif; font-weight:400;
    font-size:clamp(2.4rem, 5.4vw, 4.4rem); line-height:1.06;
    letter-spacing:-.01em; margin:0 0 1rem;
  }
  h1 em{ font-style:italic; color:var(--accent) }
  .sub{
    color:var(--muted); font-size:clamp(1rem,1.4vw,1.15rem);
    letter-spacing:.02em; margin:0 0 2.2rem;
  }
  .cta{
    display:inline-flex; align-items:center; gap:.6rem;
    padding:.95rem 1.7rem; border-radius:999px;
    background:var(--fg); color:var(--ink);
    font-weight:600; font-size:1rem; text-decoration:none;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .cta:hover{ transform:translateY(-2px); box-shadow:0 10px 30px rgba(0,0,0,.35) }
  .cta span{ transition:transform .18s ease }
  .cta:hover span{ transform:translateX(3px) }

  /* 강사 누끼 — 우측 하단에 세워 시퀀스와 한 장면이 되게 */
  .teacher{
    position:absolute; right:calc(var(--pad) * .2); bottom:0;
    height:min(78svh, 720px); width:auto; object-fit:contain;
    pointer-events:none; z-index:2;   /* 스크림 위, 텍스트 아래 */
    opacity:calc(var(--reveal,1) * .98);
    transform:translateX(calc((1 - var(--reveal,1)) * 6vw));
    max-width:44vw;   /* 좌측 텍스트 영역(52%)을 절대 침범하지 않는다 */
    filter: drop-shadow(0 18px 44px rgba(20,22,28,.28));   /* 흰 배경 기준 */
    will-change:opacity,transform;
  }
  .scrim{ opacity:var(--reveal,1) }   /* 통로 구간에선 화면 전체가 그림이 된다 */

  @media (max-width:820px){
    .track{ height:200vh }
    .overlay{ grid-template-columns:1fr; align-content:end; padding-bottom:12svh }
    .teacher{ height:46svh; right:-6% ; opacity:.5 }
  }
  @media (prefers-reduced-motion:reduce){
    .track{ height:100svh }   /* 스크럽을 끄고 첫 프레임만 */
  }
</style>
</head>
<body>

<section class="track" id="track">
  <div class="stage">
    <canvas id="seq"></canvas>
      <div class="lamp"><img src="assets/motifs/dna-2.webp" alt=""><b>약점 · 생명 시스템</b></div>
      <div class="lamp"><img src="assets/motifs/earth-system.webp" alt=""><b>복습 · 지구 시스템</b></div>
    </div>
    <div class="scrim"></div>
    <img class="teacher" id="teacher" alt="한종철 선생님">
    <div class="overlay">
      <div class="right">
        <h1 id="headline">한종철의<br><em>통합과학</em></h1>
        <p class="sub">통합과학도 철두철미하게</p>
        <a class="cta" href="#contact">상담 신청하기 <span>→</span></a>
      </div>
      <div class="left"></div>
    </div>
  </div>
</section>

<script type="module">
import { ScrubSequence } from './scrub.js';

const VARIANT = 'pull-back';
document.getElementById('teacher').src = 'assets/teacher/nobg/01-검정수트-팔짱.webp';

const manifest = await fetch('frames/manifest.json').then(r => r.ok ? r.json() : {}).catch(() => ({}));
const count = manifest[VARIANT]?.count;

// 첫 화면은 오버레이 없이 시작한다 — 스크럽이 뜨기 전에 글자가 먼저 보이면 깨진다.
document.documentElement.style.setProperty('--reveal', '0');

if (count) {
  const seq = new ScrubSequence({
    canvas: document.getElementById('seq'),
    track: document.getElementById('track'),
    count,
    src: i => `frames/${VARIANT}/f_${String(i).padStart(3, '0')}.webp`,
    window: 12,
    fill: '#FFFFFF',
    onProgress: p => {
      // 시작은 순수 애니메이션 — 텍스트도 사진도 없다. 화면 전체가 그림이다.
      // 통과가 끝나는 72%부터 사진·태그라인·CTA가 나타나며 일반 사이트로 이어진다.
      const back = Math.min(1, Math.max(0, (p - 0.72) / 0.20));
      document.documentElement.style.setProperty('--reveal', back.toFixed(3));
      // 안 보일 땐 클릭도 안 되게 — 투명한 CTA가 클릭되면 사고다.
      const ov = document.querySelector('.overlay');
      const tc = document.getElementById('teacher');
      const vis = back > 0.02 ? 'visible' : 'hidden';
      ov.style.visibility = vis; tc.style.visibility = vis;
    },
  });
  seq.start();
}
</script>
</body>
</html>
