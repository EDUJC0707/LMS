<!doctype html>
<!--
  한종철 통합과학 — 비로그인 랜딩

  배경은 먼지밭이다. 커서가 지나가면 그 자리의 먼지가 밀려나며 옅어지고, 떠나면
  서서히 되메워진다. **모티프판은 2026-07-29 에 걷어냈다**(다른 비주얼로 교체 예정) —
  왜 있었고 무엇을 배웠는지는 SPEC.md §4-옛 에 남겨 두었다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한종철 통합과학</title>
<meta name="description" content="통합과학도 철두철미하게. 한종철 통합과학.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/atom-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/logo/atom-512.png">
<link rel="apple-touch-icon" href="assets/logo/atom-180.png">
<!-- 채널톡 플러그인 키가 서는 자리. 비어 있으면 위젯이 뜨지 않는다(chat.js).
     발급: 채널톡 웹 데스크 좌측 하단 → 채널 설정 > 일반 설정 > 버튼 설치 및 설정.
     설치 화면이 주는 <script> 스니펫은 붙여넣지 말 것 — 부트는 chat.js 가 이미 한다.

     시크릿이 아니라 여기에 그냥 적는다. 채널톡 부트 스니펫이 페이지 소스에 노출하는
     공개 값이고, 신원 위조를 막는 건 서버 쪽 memberHash 다.
     **클래식 스크립트인 것이 계약이다** — chat.js 는 모듈이라 defer 로 늦게 도는 반면
     이 줄은 파싱 중 즉시 실행돼 항상 먼저 선다. 비동기로 넣으면 키를 놓친다. -->
<script>window.__CHANNEL_TALK_KEY__ = '346bbc40-aad0-4f5f-a95b-90fc47bc9f48';</script>
<!-- SUIT 가변 — 본체 앱(frontend/index.html)과 같은 서체로 간다.
     가변이라 100~900을 한 파일로 쓰고, 헤드라인은 900까지 밀어붙인다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<style>
  /* 팔레트는 배경 모티프에서 뽑았다 — 화면의 색이 두 군데서 나오면 안 된다.
     전체 평균을 쓰면 유리 하이라이트에 끌려 흰색으로 씻겨나간다. 그래서 각 에셋의
     **채도 높고 어두운** 픽셀(원자 링 음영·시냅스 소포 코어·은하 외곽)만 뽑았고,
     그중 청색계 셋(atom·synapse·universe)의 평균이 H236 이었고, 거기서 조금 더
     차갑게 **H224 '로열' 로 확정**했다(2026-07-28) — 보라 기운이 덜해 과학에 가깝고
     검정 위에서 더 또렷하다.
     휘도 위계: 배경 피크 68 < t1 110 < accent 132 < glow 172 < fg 241. */
  :root{
    --bg:#000;
    --fg:#F0F0F4;
    --dim:#5E6B9C;                    /* H224 */
    --accent:#6B87DE;                 /* H224 — 강조·로그인 */
    --glow:#9EAEE1;                   /* 먼지·별밭(field.js --glow 를 그대로 읽는다) */
    --chip:#101729;                   /* 버튼 면 */
    --line:rgba(107,135,222,.26);     /* 테두리도 같은 색상각에서 */
    --t1:#606DA4;                     /* 헤드라인 1행 — 휘도 110 */
    --t2:#EEF1FA;                     /* 헤드라인 2행 */
    /* viewport-fit=cover 라 노치 폰 가로에서 좌우가 잘린다(inset 44~59px 인데
       clamp 는 33.3px). 세이프에어리어를 패딩에 더한다 — 노치가 없으면 env 가 0 이라
       세로·데스크탑은 값이 그대로다. */
    --pad:calc(clamp(20px, 4.5vw, 72px) + max(env(safe-area-inset-left), env(safe-area-inset-right)));
    --nav:72px;
  }
  *{ box-sizing:border-box; margin:0 }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth }
  /* 배경 애니메이션은 field.js 가 끄는데 스크롤 애니메이션은 CSS 라 그대로 남아 있었다 */
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto }
    *, *::before, *::after{ animation-duration:.001ms !important; transition-duration:.001ms !important }
  }
  body{
    background:var(--bg); color:var(--fg);
    font-family:"SUIT Variable","SUIT","Apple SD Gothic Neo",system-ui,sans-serif;
    font-weight:450;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  a{ color:inherit; text-decoration:none }

  /* ── nav — 히어로와 이어져 경계가 없다 ─────────────────────── */
  .nav{
    position:fixed; inset:0 0 auto; height:var(--nav); z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 var(--pad); background:var(--bg);
  }
  /* nav 에도 같은 먼지가 뜬다 — nav 는 항상 불투명 검정이라 히어로 먼지밭을
     가로로 잘라 먹는다. 여기서 이어 주지 않으면 상단 64px 만 텅 빈 띠가 된다.
     **커서에 반응하지 않는다**(사용자 지시): 연속성만이 목적이고, 화면 맨 위에서
     계속 움직이면 그게 곧 방해다. */
  .navdust{ position:absolute; inset:0; z-index:0; pointer-events:none; mix-blend-mode:screen }
  .nav > .navL, .nav > .login{ position:relative; z-index:1 }
  .navL{ display:flex; align-items:center; gap:clamp(1.1rem,2.4vw,2.2rem); min-width:0 }
  .brand{ display:flex; align-items:center; gap:.6rem; font-size:1.06rem; font-weight:800; letter-spacing:-.025em; white-space:nowrap }
  .brand img{ width:30px; height:30px; display:block }
  /* 섹션 이동. 라벨 그대로가 목적지 이름이다.
     메뉴는 흰색이고 로열은 버튼 하나만 쓴다(사용자 지시 2026-07-28) — 색이 곧
     '누를 것'의 표시가 되게. 링크가 같은 색이면 버튼이 안 튄다. */
  .navL nav{ display:flex; gap:clamp(.9rem,1.8vw,1.6rem) }
  .navL nav a{
    font-size:.97rem; font-weight:600; letter-spacing:-.02em;
    color:var(--fg); opacity:.72; transition:opacity .18s; white-space:nowrap;
  }
  .navL nav a:hover{ opacity:1 }
  .login{
    padding:.58rem 1.3rem; border:1px solid var(--line); border-radius:999px;
    font-size:.96rem; font-weight:700; letter-spacing:-.02em;
    color:var(--accent); background:var(--chip);
    transition:color .2s, border-color .2s, background .2s;
  }
  .login:hover{ color:#080813; background:var(--accent); border-color:var(--accent) }

  /* ── 히어로 ────────────────────────────────────────────── */
  .hero{
    position:relative; min-height:100svh; padding:var(--nav) var(--pad) 0;
    display:grid; grid-template-columns:1fr 1fr; align-items:center;
    overflow:hidden;
  }

  /* ── 배경 — 커서가 지나간 곳만 드러난다 ──────────────────────
     원형 마스크를 지웠다. 페더를 아무리 부드럽게 해도 원은 원이라, 감쇠를 레이어가
     아니라 개체별 스칼라로 옮겨 화면에 남는 경계선을 모티프 실루엣뿐으로 만든다.
     피크 렌더휘도 68 < 헤드라인 110 — 배경이 전경보다 어두워야 위계가 선다. */
  .field{ position:absolute; inset:0; z-index:0; overflow:hidden; contain:paint }

  /* 우주 — **커서 자리에서만 드러난다.** 평소에는 없다(= body 의 검정이 보인다).
     검정은 레이어가 아니다. 우주가 없는 상태일 뿐이다.

     드러내는 창은 **먼지가 걷히는 그 창을 그대로 쓴다** — exp(-d²/2R²), 반경 R.
     따로 만들면 두 개가 미묘하게 어긋나 "왜 여기는 걷혔는데 안 보이지" 가 된다.

     캔버스인 이유: mask-image 는 매 프레임 전면 재래스터라 비싸고, opacity 로는
     "커서 자리만" 을 표현할 수 없다(요소 전체에 걸린다). 캔버스는 커서 둘레
     사각형만 건드리면 된다.
     원본(img/video)은 화면에 안 나온다 — 캔버스가 읽어 가는 재료일 뿐이다. */
  .space{ position:absolute; inset:0; z-index:0; pointer-events:none; display:block }
  .spacesrc{ position:absolute; width:0; height:0; opacity:0; pointer-events:none }

  .dust, .wash, .motifs{ position:absolute; pointer-events:none; display:block }
  .dust, .motifs{ inset:0 }
  .dust{ mix-blend-mode:screen }    /* 검정 위에서 먼지가 빛으로 읽힌다 */
  .wash{ left:0; top:0 }            /* 크기·margin 은 JS 가 창 반경으로 계산 */

  /* 모티프는 DOM 요소가 아니라 캔버스 한 장이다. 개체별 opacity 로는 "원자의
     왼쪽 고리만 보인다" 를 표현할 수 없어서 — 반응 단위가 개체가 아니라
     픽셀이어야 하기 때문이다. 손전등 모양으로 잉크를 오려내는 일은 JS 가 한다. */

  /* 텍스트는 필드 위 */
  .copy{ position:relative; z-index:2; grid-column:1; max-width:44rem }
  /* 검정 위 흰 글자 두 줄이 화면의 전부다. 크게, 무겁게, 바짝 붙여서
     덩어리로 읽히게 한다 — 자간을 조이지 않으면 커질수록 흩어져 보인다. */
  h1{
    font-weight:900;
    /* 2026-07-28: 30% 작게. 히어로의 무게중심을 글자에서 배경으로 옮긴다 */
    font-size:clamp(2.1rem, 5.3vw, 4.9rem);
    /* 줄 사이를 line-height 가 아니라 gap 으로 벌린다 — line-height 는 글자 위아래
       여백을 같이 키워서 "두 줄 사이"만 따로 조절할 수가 없다.
       em 이라 글자 크기를 바꿔도 비율이 유지된다. */
    display:flex; flex-direction:column;
    gap:var(--h1-gap, .20em);
    line-height:1;
    letter-spacing:-.045em;
    word-break:keep-all;
    text-shadow:0 0 72px #000, 0 0 30px rgba(8,8,19,.95);
  }
  h1 span{ display:block }
  /* 두 행 모두 배경과 같은 색상각(H236 네이비)이다. 1행은 물러서고 2행이 앞에 선다.
     1행 휘도 110 — 배경 피크 68 보다 높아야 위계가 무너지지 않는다. */
  h1 .t1{ color:var(--t1) }
  h1 .t2{ color:var(--t2) }

  /* 강사 — 우측, 바닥에 선다. 100% 불투명이다.
     하단 페이드 마스크를 걷어냈다 — 부분 투명도 투명이고, 인물이 흐려지면
     배경 모티프와 같은 층으로 읽힌다. 뒤로 모티프가 지나가지도 않는다. */
  /* picture 는 .hero 그리드의 칸을 하나 차지한다. 안쪽 img 는 absolute 라 흐름 밖이므로
     껍데기만 걷어낸다 — display:contents 여도 img 의 절대배치 기준은 .hero 그대로다. */
  .hero > picture{ display:contents }
  .teacher{
    /* 확정: 80svh · 상한 820px · 오른쪽 5% · 바닥 0%
       (2026-07-28 확정 → 08-04 사진을 갈아 끼우고 재확인).

       사진을 바꿀 때 **높이 숫자가 아니라 화면에서 보이는 크기를 맞춘다.** 새 사진은
       프레임이 좁아(머리폭이 프레임의 39.1%, 예전은 39.5%) 같은 높이에서 머리가
       예전의 85.5% 로 작아진다. 예전과 똑같이 맞추면 94svh 가 나오는데 실제로 보니
       커서, 80 을 그대로 쓰기로 했다 — 맞춰야 할 기준선이 아니라 출발점이었다.

       **투명 여백은 반드시 잘라내고 넣는다.** 원본처럼 인물이 프레임의 65% 만
       차지하면 80svh 가 빈 공간까지 재서 인물이 52svh 로 나온다.

       이 값은 debug.js 의 TEACHER0 에도 복제돼 있다 — 함께 고쳐야 패널을 여는 순간
       화면이 튀지 않는다. */
    position:absolute; right:var(--teacher-right, 5%); bottom:var(--teacher-bottom, 0%); z-index:1;
    height:min(var(--teacher-h, 80svh), 820px); width:auto;
    object-fit:contain; object-position:bottom right;
    pointer-events:none; user-select:none;
    opacity:1;
  }

  /* ── 아래 섹션 — 색이 바뀐다 ──────────────────────────────── */
  section{ padding:clamp(80px,13vh,180px) var(--pad) }
  .sec-head{ max-width:52rem; margin:0 auto clamp(32px,5vh,56px) }
  .sec-head h2{
    font-weight:900; font-size:clamp(2rem,4.2vw,3.2rem);
    letter-spacing:-.04em; line-height:1.05; margin-bottom:.9rem;
  }
  .sec-head p{ color:var(--dim); font-size:clamp(.95rem,1.3vw,1.05rem); line-height:1.7 }
  /* opacity:.75 를 --dim 위에 곱해 3.66:1 이었다(AA 4.5 미달). 겹친 투명도를 걷는다 */
  .stamp{ display:block; margin-top:1rem; font-size:.8rem; color:var(--dim) }
  /* 52rem(832px) — 60rem 은 규칙선이 글보다 450px 더 가서 오른쪽이 비었다.
     한 줄 길이도 여기가 읽기 좋다(한글 45~50자). */
  .wrap{ max-width:52rem; margin:0 auto }

  /* 커리큘럼 — 밝음 */
  #curriculum .sec-head{ margin-left:0; margin-right:auto }
  #curriculum{
    background:#F4F2ED; color:#14151C; --dim:#666B7A; --line:rgba(20,21,28,.12);
    --sec:#F4F2ED;   /* 노드가 레일을 뚫고 앉을 때 쓰는 배경색 */
  }
  .tracks{ display:flex; gap:8px; margin-bottom:2.4rem; flex-wrap:wrap }
  .track{
    padding:.6rem 1.15rem; border-radius:999px; border:1px solid var(--line);
    font-size:.9rem; font-weight:600; color:var(--dim); cursor:pointer;
    background:transparent; font-family:inherit;
  }
  .track[aria-selected="true"]{ background:#14151C; color:#fff; border-color:#14151C }
  /* 네 단계를 관통하는 진행 레일. 단계가 "번호 텍스트"가 아니라 선 위의 위치로
     존재해야 1→4 가 진도로 읽힌다(메가스터디는 이걸 색 밴드로 한다).
     우리는 색을 늘리지 않고 **잉크 농도 하나로만** 진도를 말한다 — 무지개를 쓰면
     네 단계가 네 종류의 다른 것처럼 보인다. 같은 것의 진행이다. */
  .steps{ display:grid; position:relative }
  /* 레일은 첫 노드 중심에서 끝 노드 중심까지 **정확히** 걸린다. 끝점이 없으면
     선이 마지막 단계를 지나 흘러내려 "아직 더 있나" 로 읽힌다.
     높이는 렌더 후 JS 가 재어 넣는다 — 단계 수·본문 줄 수에 따라 달라진다. */
  .steps::before{
    content:''; position:absolute; left:.63rem;
    top:var(--rail-top,2.4rem); height:var(--rail-h,0);
    width:1px; background:var(--line);
  }
  /* 행 구분선을 뺐다 — 레일이 이미 행을 나누고 있어서 둘이 같은 일을 두 번 하면
     표로 되돌아간다. 나누는 일은 여백이 한다. */
  /* [번호] [단계·무엇을 하는가] [어디를 덮는가] — 뒤 두 열이 성격이 다른
     두 정보다. 한 열에 섞으면 범위가 제목의 꼬리처럼 읽힌다. */
  .step{
    display:grid; grid-template-columns:4rem minmax(0,1fr) 12.5rem; gap:1.4rem 1.6rem;
    padding:0 0 2.4rem;
  }
  .step:last-child{ padding-bottom:0 }
  /* 번호와 노드가 같은 색을 쓴다(currentColor) — 농도가 한 번에 따라온다 */
  .step-no{
    position:relative; padding-left:1.7rem;
    font-size:1.5rem; font-weight:800; line-height:1;
    font-variant-numeric:tabular-nums; letter-spacing:-.05em;
  }
  .step-no::before{
    content:''; position:absolute; left:.3rem; top:.34rem;
    width:.66rem; height:.66rem; border-radius:50%;
    background:currentColor; box-shadow:0 0 0 5px var(--sec);
  }
  /* #9096A2 는 밝은 배경에서 2.65:1 — 대형 텍스트 문턱 3.0 에도 못 미쳤다.
     농도 진행(01 연함 → 04 진함)은 유지하되 첫 칸을 문턱 위로 올린다. */
  .step:nth-child(1) .step-no{ color:#7C8290 }
  .step:nth-child(2) .step-no{ color:#717785 }
  .step:nth-child(3) .step-no{ color:#3E4350 }
  .step:nth-child(4) .step-no{ color:#14151C }
  /* 마지막 단계는 속을 채워 닫는다 — 링이 아니라 점이어야 "끝" 으로 읽힌다 */
  .step:nth-child(4) .step-no::before{ width:.8rem; height:.8rem; top:.28rem; left:.23rem }
  .step h3{ font-size:1.26rem; font-weight:800; margin-bottom:.4rem; letter-spacing:-.035em }
  .step p{ color:#2E3340; font-size:.96rem; line-height:1.6; word-break:keep-all }
  .badge{
    display:inline-block; margin-left:.55rem; padding:.18rem .5rem; border-radius:5px;
    font-size:.7rem; font-weight:700; letter-spacing:.02em;
    background:rgba(107,135,222,.15); color:#3A4B8C; vertical-align:.16em;
  }
  /* 대단원은 태그가 아니라 그 단계가 덮는 범위다. 알약으로 늘어놓으면 "태그"로
     읽히고, 4개·2개·0개인 것이 의미인데 그 차이가 죽는다. 한 줄로 잇는다. */
  .scope{
    padding-top:.42rem; font-size:.82rem; color:var(--dim);
    line-height:1.95; letter-spacing:.005em;
  }
  .scope div{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  /* 단계 목록에서 떼어낸다. 붙어 있으면 STEP 05 로 읽힌다 —
     "단계와 별도" 라고 써 놓고 배치가 반대였다. */
  .mock{
    margin-top:4.5rem; padding-left:1.1rem; border-left:2px solid var(--line);
  }
  .mock h3{ font-size:1rem; font-weight:800; margin-bottom:.35rem; letter-spacing:-.02em }
  .mock p{ color:var(--dim); font-size:.92rem; line-height:1.6 }
  /* 커리큘럼 구조의 근거. 법적 고지는 성격이 달라 footer 로 내렸다 */
  .note{
    margin-top:3.2rem; padding-top:1.4rem; border-top:1px solid var(--line);
    font-size:.84rem; color:var(--dim); line-height:1.7; max-width:38rem; word-break:keep-all;
  }

  /* 정오표 — 중간톤 */
  #errata{ background:#15161F; color:#E7E8F0; --dim:#8A8DA8; --line:rgba(120,126,215,.22) }
  .tbl{ width:100%; border-collapse:collapse; font-size:.92rem }
  .tbl th{
    text-align:left; font-size:.78rem; font-weight:600; letter-spacing:.03em;
    color:var(--dim); padding:0 0 .8rem; border-bottom:1px solid var(--line);
  }
  /* 열 사이 여백이 0 이라 360px 에서 교재명 끝과 날짜가 1.88px 까지 붙어
     `…실전 모의26.06.22` 로 한 문자열처럼 읽혔다. 마지막 열만 오른쪽 여백을 뺀다. */
  .tbl td{ padding:1.05rem .8rem 1.05rem 0; border-bottom:1px solid var(--line); vertical-align:top }
  .tbl th{ padding-right:.8rem }
  .tbl td:last-child, .tbl th:last-child{ padding-right:0 }
  /* 교재만 늘어난다. 날짜는 tabular-nums 로 폭이 고정이고, 다운로드는 버튼 하나다 */
  .tbl th:nth-child(2){ width:8rem }
  .tbl th:nth-child(3){ width:7rem }
  .tbl .num{ font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--dim) }
  .title-cell{ font-weight:600 }
  /* margin-left 가 줄바꿈 뒤에도 남아 배지가 어중간하게 들여쓰였다.
     앞 공백을 마진 대신 여백 문자로 붙여 줄이 바뀌면 마진이 안 남게 한다. */
  .new{
    display:inline-block; margin-left:0; padding:.1rem .42rem; border-radius:4px;
    font-size:.66rem; font-weight:700; background:#E8EAEE; color:#1C1E23; vertical-align:.14em;
  }
  /* 확장자를 그대로 라벨로 쓴다 — 무엇이 내려오는지 파일이 스스로 말한다 */
  .dl{
    display:inline-block; font-size:.74rem; font-weight:700; letter-spacing:.04em;
    color:var(--dim); border:1px solid var(--line); border-radius:6px;
    padding:.3rem .6rem; transition:color .18s, border-color .18s;
  }
  .dl:hover{ color:#fff; border-color:rgba(255,255,255,.4) }
  .tbl td.empty{ padding:2.6rem 0; color:var(--dim); font-size:.92rem }
  /* 왼쪽 정렬. 오른쪽 끝에 혼자 떠 있으면 표가 비었을 때 갈 곳 없는 버튼이 된다 */
  .report{ margin-top:2rem; display:flex }
  .btn{
    padding:.7rem 1.4rem; border-radius:999px; background:#E7E8F0; color:#15161F;
    font-size:.88rem; font-weight:700; white-space:nowrap; border:0; cursor:pointer;
    font-family:inherit;
  }

  /* 컨택트 — 검정으로 되돌아온다. 셋 중 혼자 가운데 정렬이라 튀었다: 왼쪽으로 맞췄다.
     세로 180px 패딩에 h2 하나 + 버튼 하나뿐이라 미완성으로 읽혀서
     footer 와 한 덩어리로 묶었다(아래 여백을 걷고 구분선으로 잇는다). */
  #contact{ background:#000; padding-bottom:clamp(34px,4.5vh,56px) }
  #contact .sec-head{ margin-bottom:1.6rem }
  .ch{
    display:inline-block; padding:.85rem 1.8rem; border-radius:999px;
    background:var(--accent); color:#080813; font-weight:700; font-size:.95rem;
    border:0; cursor:pointer; font-family:inherit;
  }
  footer{
    padding:clamp(20px,2.6vh,30px) var(--pad) clamp(40px,5.5vh,64px); background:#000;
    color:var(--dim); font-size:.8rem; line-height:1.8;
  }
  /* space-between 이 사업자 정보를 오른쪽 끝으로 밀어서 브랜드와 700px 떨어져
     있었다 — 푸터가 아니라 관계없는 두 조각으로 읽혔고, `—` 들이 화면 맨 오른쪽에
     매달렸다. 위아래로 쌓고 왼쪽에 맞춘다. */
  .foot{
    max-width:52rem; margin:0 auto;
    padding-top:clamp(22px,3vh,30px); border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:1.15rem;
  }
  .foot b{ color:var(--fg); font-weight:700; font-size:.86rem; letter-spacing:-.02em }
  /* 라벨-값이 한 줄로 흐른다(국내 푸터 관행). 세로 dt/dd 격자는 값이 넷뿐이라
     빈 칸이 더 눈에 띄었다. */
  .foot dl{ display:flex; flex-wrap:wrap; gap:.3rem 1.5rem; margin:0; font-size:.78rem }
  .foot dl div{ display:flex; gap:.45rem }
  /* 라벨은 줄어들지 않는다. 주소 값이 길어서 flex 가 dt 를 짜부라뜨렸고
     `주소` 가 `주`/`소` 로 쪼개졌다(390px 에서 dt 박스 19x45 — 한 글자 폭에 두 줄). */
  .foot dt{ opacity:.55; flex-shrink:0; white-space:nowrap }
  .foot dd{ margin:0 }

  /* ── 모바일 ──────────────────────────────────────────────── */
  @media (max-width:860px){
    /* 섹션 링크는 접는다 — 390px 에서 로그인 버튼을 20px 침범한다.
       아래로 내려가면 섹션이 순서대로 나오므로 이동 수단이 사라지지는 않는다. */
    .navL nav{ display:none }

    /* nav 는 불투명 검정이라 히어로 맨 위 72px 을 가로로 잘라 먹는다. 먼지는
       .navdust 가 이어 주지만 우주는 이어 주는 것이 없어서, 자율 드리프트가 위로
       올라오면 nav 아랫변에 화면을 가로지르는 직선이 생긴다(390x844 에서 시간의
       34.7%, 1회 중앙값 13.8초). 히어로 꼭대기에 있을 때만 아래 16px 을 연다.
       먼지 캔버스도 **같은 램프로** 깎아야 둘을 더해 밀도가 유지된다. */
    .nav.attop{
      background:linear-gradient(180deg, var(--bg) 0 calc(var(--nav) - 16px), transparent var(--nav));
    }
    .nav.attop .navdust{
      -webkit-mask-image:linear-gradient(180deg,#000 0 calc(var(--nav) - 16px),transparent var(--nav));
      mask-image:linear-gradient(180deg,#000 0 calc(var(--nav) - 16px),transparent var(--nav));
    }
    /* 세로 화면에는 데스크탑의 짝(왼쪽 글자 ↔ 오른쪽 사람)이 없다. 붙여서 하나로 만든다.
       잉크가 하나도 지나가지 않던 가로 띠가 nav 아래 214px + 헤드라인 아래 146px
       = 360px, 화면의 42.7% 였다. 데스크탑은 같은 띠가 88px(11%) 뿐인데 강사가
       높이의 80% 를 차지해 헤드라인이 뜬 스캔라인에도 그의 몸이 걸리기 때문이다.
       **빈 공간은 원인이 아니라 결과였다** — 강사가 절반으로 줄어서 생긴 자리다.

       뒤의 상수(10svh)가 **헤드라인과 머리 사이 간격**이다. 3.5 일 때 nav 아래 153px /
       머리 위 30px 로 5:1 이었다 — 위가 비고 아래가 붙었다. 헤드라인이 둘 사이에 있어서
       이 수 하나가 두 간격을 맞바꾼다. 10 에서 98/85 로 거의 균형이다.
       더 키우면 아래가 위보다 넓어지는데, 무거운 쪽(인물)이 글에 더 붙는 그림이라
       어색하다. 13 을 넘기면 헤드라인이 인물에서 떨어져 화면 한복판에 뜬다 —
       아래 calc 결합이 막으려던 바로 그 상태다.

       padding-bottom 을 --teacher-h-sm 에 묶어 헤드라인 자리를 강사 높이의 함수로
       만든다. 마법값 하나를 다른 마법값으로 바꾸지 않으려는 것이고, 덕분에 누가
       강사 높이를 만져도 둘이 다시 갈라지지 않는다. */
    .hero{
      grid-template-columns:1fr;
      align-content:end;
      padding-bottom:calc(var(--teacher-h-sm, 58svh) + var(--hero-gap, 12svh));
    }
    .copy{ max-width:none }
    /* clamp 하한 2.1rem 이 634px 밑에서 그대로 걸려(2.1rem ÷ 5.3vw = 634px)
       320~634px 전 구간이 33.6px 로 얼어 있었다. 390px 에서 2행 잉크가 칸의 47.7%
       뿐이고 같은 페이지 데스크탑은 57.9% 다.

       **상한 45.6px 은 취향이 아니라 경계가 준다.** 861px(데스크탑 첫 픽셀)에서
       5.3vw = 45.633px 이므로, 모바일이 이걸 넘으면 860→861 을 건널 때 화면이
       넓어지는데 글자가 작아진다. 45.6px 은 그 아래라 경계가 증가 방향으로 이어진다.
       넘침 검산: 한글 실효 어드밴스 0.8288em(실측), 2행 6자 = 4.9728em →
       320px 에서 줄바꿈 없는 최대치가 56.3px 이므로 45.6px 은 안전하다. */
    /* 2026-08-06 사용자 지시로 두 번에 걸쳐 키웠다: 2.85rem(45.6px) → 3.14 → 3.30rem(52.8px).
       **860 경계에서 이어지지 않는다** — 861px(데스크탑 첫 픽셀)의 5.3vw 가 45.63px 이라
       860→861 을 건너면 글자가 52.8 → 45.6 으로 작아진다. 실기기에는 그 경계를 건너는
       일이 없고(폭이 고정) 브라우저 창을 끄는 사람에게만 보인다. */
    /* **vw 항이 실제로 크기를 정한다.** 390px 에서 11.7vw = 45.63px 이고 상한
       3.30rem(52.8px)은 451px 부터야 걸린다 — 상한만 올리면 폰에서는 아무 일도
       안 일어난다(2026-08-06 에 두 번 그렇게 놓쳤다). 10%+5% 를 vw 에 건다:
       11.7 × 1.155 = 13.51vw → 390px 에서 52.7px. */
    h1{ font-size:min(13.51vw, 3.30rem) }   /* 390px 에서 52.7px */
    /* 40svh 는 데스크탑(80svh)의 절반이라 머리폭이 83px — 데스크탑 157px 의 53% 였다.
       오른쪽 -12% 는 46.8px 을 잘랐는데, PNG 알파를 훑어 보면 팔짱 낀 팔꿈치가
       인물 폭의 **99.71%** 까지 나간다(알파 전수 스캔, 임계 8). 파일이 실루엣에 딱 붙게
       잘려 있어서 -3% 도 이미 살짝 자른다 —
       고른 값이 아니라 사진에서 나온 값이다. */
    .teacher{ height:var(--teacher-h-sm, 58svh); right:var(--teacher-right-sm, -3%); bottom:var(--teacher-bottom-sm, 0%) }
    .steps::before{ display:none }
    .step{ grid-template-columns:1fr; gap:.55rem; padding-bottom:2rem }
    /* 좁은 화면에서는 뒤 두 열이 고정폭을 그대로 붙들어 교재가 110px 만 받고
       세 줄로 접혔다 — 내용 열이 가장 좁아지면 안 된다. 날짜는 `26.07.28` 이
       들어가면 되고 버튼은 `XLSX` 가 들어가면 된다. */
    .tbl th:nth-child(2){ width:5.4rem }
    .tbl th:nth-child(3){ width:4.2rem }
    .scope{ padding-top:.3rem; line-height:1.8 }

    /* 세로 패딩이 vh 기반이라 화면이 좁아질수록 글 단 대비 비율이 벌어진다 —
       섹션 사이가 219px 로 데스크탑(208px)보다 넓은데 글 단은 350px 로
       데스크탑 832px 의 42% 다. 좁은 화면에서는 여백도 같이 줄인다. */
    section{ padding:clamp(56px,9vh,110px) var(--pad) }
    /* 문의는 h2 하나 + 버튼 하나뿐인데 위가 110px, 아래가 38px 로 2.89:1 이었다 */
    #contact{ padding-top:clamp(44px,7vh,84px) }
    /* 레일을 숨겼으므로 노드 점과 그 자리(padding-left)도 같이 걷는다 —
       안 걷으면 번호만 22.4px 안으로 밀려 제목·본문과 왼쪽 끝이 어긋나고
       점은 잇는 선 없는 불릿으로 혼자 남는다. */
    .step-no{ padding-left:0; font-size:1.3rem }
    .step-no::before{ display:none }

    /* 채널톡 런처가 앉을 자리를 비운다. 런처는 화면 오른쪽 아래에 고정으로 뜨는데
       (24px 안쪽, 56px 크기 — 채널톡 번들 실측) 좁은 화면에서는 사업자 정보가
       거기까지 흘러 내려와 `주소` 를 덮었다(390px 22×22 · 430px 8×22 실측).
       세이프에어리어를 더해도 겹침이 남아서 아래를 그만큼 비운다.
       600px 부터는 사업자 정보가 런처까지 닿지 않아 여기(모바일)에만 건다. */
    footer{ padding-bottom:calc(env(safe-area-inset-bottom) + 24px + 56px + 16px) }

    /* 탭 타깃을 HIG 최소 44 로 올린다. 전부 세로만 모자랐다 —
         브랜드 143.8x30 · 로그인 83x39.5 · 트랙 탭 113.5x39.2 ·
         PDF/XLSX 45.4x26.6 · 제보하기 94x40.4
       패딩만 늘리므로 **보이는 크기는 그대로**다. 브랜드는 배경이 없어 눈에 띄는
       변화가 아예 없고(로고 30 + 7x2 = 44), 알약 셋은 알약이 실제로 커진다. */
    .brand{ padding-block:7px }
    .login{ padding-block:.74rem }
    .track{ padding-block:.78rem }
    .btn{ padding-block:.82rem }
    /* 표 안이라 알약을 키우면 행 높이가 밀린다. 히트 영역만 넓힌다 —
       보이는 테두리는 그대로 두고 ::after 로 44 높이의 투명 판을 덮는다. */
    .dl{ position:relative }
    .dl::after{
      content:''; position:absolute; left:0; right:0;
      top:50%; height:44px; transform:translateY(-50%);
    }

    /* 좁은 화면에서 사업자 정보를 한 줄로 흘리면 줄바꿈이 값 길이에 좌우돼
       들쭉날쭉해진다(상호+사업자등록번호가 한 줄, 대표 혼자 한 줄, 주소는 두 줄).
       라벨 열·값 열로 세워 한 쌍이 한 행을 갖게 한다.
       display:contents 로 래퍼 div 를 걷어내 dt/dd 가 직접 격자 칸이 된다. */
    .foot dl{ display:grid; grid-template-columns:auto 1fr; gap:.4rem .8rem }
    .foot dl div{ display:contents }
    /* 건물명이 어절 중간에서 쪼개졌다(`파크뷰오피스` / `타워 1401호`).
       한국어 기본 줄바꿈은 글자 단위라 공백 없는 고유명사가 아무 데서나 끊긴다. */
    .foot dd{ word-break:keep-all }

    /* 라벨이 --dim(#5E6B9C) 위에 opacity:.55 를 곱해 검정 대비 **1.90:1** 이었다 —
       법정 표시 의무 항목이 사실상 안 읽혔다. 겹친 opacity 를 걷는다(팔레트에 새 색을
       더하지 않는다 — 색이 두 군데서 나오면 안 된다). 값도 4.06:1 이라 AA 미달이라
       푸터 본문만 한 단계 올린다. */
    footer{ color:#8F9ABF }
    .foot dt{ opacity:1; color:#6E79A6 }
  }

  /* 가로로 눕힌 폰. 64svh 짜리 강사 위에 헤드라인을 얹으면 nav 를 뚫는다
     (740x360 에서 헤드라인 top 32.6px < --nav 72px). */
  @media (max-width:860px) and (max-height:599px){
    .hero{ align-content:center; padding-bottom:32svh }
    /* **-12% 를 되살리면 안 된다.** right 는 뷰포트 폭의 %인데 이미지는 높이로 재므로,
       넓고 낮은 화면에서 -12% 가 이미지 폭보다 커진다 — 800x360 에서 이미지 폭 91px 에
       밀어내는 양 96px 라 **가시폭 0px**, 강사가 통째로 화면 밖으로 나간다.
       가로에서는 인물이 이미 작으니 블리드 자체가 필요 없다. */
    .teacher{ height:46svh; right:2% }
  }
  /* prefers-reduced-motion 은 JS 가 처리한다 — 정적 1프레임만 그린다.
     CSS 로 배경을 끄면 히어로가 통째로 검게 남는다. */
</style>
</head>
<body>

<!-- 로그인 전에는 "LMS"를 걸지 않는다(사용자 지시 2026-07-28) — 비로그인 방문자에게
     LMS 는 제품 내부 명칭이고, 여기서 파는 것은 강의다. -->
<div class="nav">
  <div class="navL">
    <a class="brand" href="/">
      <img src="assets/logo/atom-180.png" alt="">
      한종철 통합과학
    </a>
    <nav>
      <a href="#curriculum">커리큘럼</a>
      <a href="#errata">정오표</a>
      <a href="#contact">문의하기</a>
    </nav>
  </div>
  <a class="login" href="/student/login">로그인</a>
</div>

<header class="hero">
  <!-- 우주 사진(정적) → 먼지밭. 커서가 지나가면 먼지가 걷히고 우주가 드러난다 -->
  <div class="field" id="field" aria-hidden="true">
    <canvas class="space"></canvas>
    <img class="spacesrc" id="spaceImg" alt="" decoding="async">
    <video class="spacesrc" id="spaceVid" muted loop playsinline preload="none"></video>
  </div>

  <div class="copy">
    <h1>
      <span class="t1">통합과학도</span>
      <span class="t2">철두철미하게</span>
    </h1>
  </div>

  <!-- 모바일만 갈아 끼운다. 데스크탑은 <img src> 로 PNG 를 그대로 받아 바이트도
       픽셀도 오늘과 같다. srcset+sizes 가 아니라 media 를 쓰는 이유: DPR3 폰은
       필요 픽셀을 1029 로 계산해 srcset 으로는 도로 1.7MB PNG 를 집어간다.
       실측 1,738,120 B → 136,202 B (-92.2%), 알파 최대차 0. -->
  <picture>
    <source media="(max-width:860px), (max-height:600px)" type="image/webp"
            srcset="assets/teacher/nobg/teacher.webp">
    <img class="teacher" src="assets/teacher/nobg/teacher.png" alt="한종철 선생님">
  </picture>
</header>

<main>
<section id="curriculum">
  <div class="wrap">
    <div class="sec-head">
      <h2>커리큘럼</h2>
      <p>내신과 수능을 같은 개념으로 잡습니다.</p>
    </div>

    <div class="tracks" role="tablist">
      <button class="track" role="tab" aria-selected="true" aria-controls="steps" data-track="naesin">고1·고2 내신</button>
      <button class="track" role="tab" aria-selected="false" aria-controls="steps" data-track="suneung">2028 수능</button>
    </div>

    <div class="steps" id="steps" role="tabpanel" aria-live="polite"></div>

    <div class="mock">
      <h3>실전 모의고사</h3>
      <p>시즌마다 새로 나옵니다.</p>
    </div>

    <p class="note">
      통합과학은 2028학년도가 첫 시행이라 수능 기출이 없습니다.<br>
      그래서 기출 분석 단계를 두지 않습니다.
    </p>
  </div>
</section>

<section id="errata">
  <div class="wrap">
    <div class="sec-head">
      <h2>교재 정오표</h2>
      <span class="stamp" id="errata-stamp"></span>
    </div>
    <div id="errata-body"></div>
    <div class="report">
      <button class="btn" data-chat="정오표 제보">제보하기</button>
    </div>
  </div>
</section>

<section id="contact">
  <div class="wrap">
    <div class="sec-head">
      <h2>문의</h2>
    </div>
    <button class="ch" data-chat="상담 문의">채팅으로 문의하기</button>
  </div>
</section>
</main>

<footer>
  <div class="foot">
    <div>
      <b>한종철 통합과학</b> © 2026
    </div>
    <!-- 사업자 정보(2026-08-05 수령). 교육 서비스는 전자상거래법상 표시 의무가 있다.
         **통신판매업신고 줄은 일부러 뺐다** — 신고번호를 아직 못 받았고, 정부 신고번호는
         비워 두거나 지어낼 수 있는 값이 아니다(허위 표시이고 남의 번호일 수도 있다).
         번호가 나오면 아래 dl 에 같은 형태로 한 줄 되살린다(성남시청 신고 → 며칠). -->
    <dl>
      <div><dt>상호</dt><dd>(주)에듀제이씨</dd></div>
      <div><dt>사업자등록번호</dt><dd>261-81-13583</dd></div>
      <div><dt>대표</dt><dd>한종철</dd></div>
      <div><dt>주소</dt><dd>경기 성남시 분당구 정자일로 248 (정자동, 파크뷰) 파크뷰오피스타워 1401호</dd></div>
    </dl>
  </div>
</footer>

<script type="module">
import { SPACE, CURRICULUM, ERRATA } from './data.js';
import { mountField, mountNavDust } from './field.js';
import { openChat } from './chat.js';

/* 히어로 — 숨은 6개 */
/* 배경. **모티프판은 걷어냈다**(2026-07-29) — 빈 목록을 넘기면 이미지를 받지도
   굽지도 않고, 오려낼 잉크가 없어 먼지와 바람만 남는다. 렌더 코드는 그대로 두었다:
   다른 비주얼이 정해지면 그 자리에 넣으면 된다. 기록은 SPEC.md §4-옛. */
mountField(document.getElementById('field'), []);

/* 배경을 건다. data.js 의 `use: true` 하나가 기준이다 — 없으면 검정이고,
   그건 디버그를 열기 전까지 아무 배경도 없던 지금까지의 상태다. */
{
  const bg = SPACE.find(s => s.use);
  if (bg) window.__field?.space?.(bg.src, bg.zoom ?? 1);
}
mountNavDust(document.querySelector('.nav'));

/* nav 아랫변에 우주가 잘려 생기던 직선을 없앤다(.attop). **터치에서만** 건다 —
   우주를 nav 밑으로 밀어 올리는 것은 COARSE 의 자율 드리프트뿐이고, 데스크탑은
   커서가 바람을 쥔다. 스크롤하면 도로 닫는다: 밝은 커리큘럼 섹션이 nav 아래로
   비치면 제목이 유령처럼 배어 나온다. */
if (matchMedia('(hover: none) and (pointer: coarse)').matches) {
  const nv = document.querySelector('.nav');
  const syncTop = () => nv.classList.toggle('attop', scrollY < 8);
  syncTop();
  addEventListener('scroll', syncTop, { passive: true });
}

/* 디버그 패널 — ⌘⌥D(맥) / Ctrl+Alt+D. 누르기 전에는 debug.js 를 내려받지도 않는다.
   code 로 본다(key 가 아니라) — ⌥ 조합에서 macOS 는 key 를 '∂' 로 바꿔 준다. */
addEventListener('keydown', async e => {
  if (e.code !== 'KeyD' || !e.altKey || !(e.metaKey || e.ctrlKey)) return;
  e.preventDefault();
  if (window.__closeDebug) { window.__closeDebug(); window.__closeDebug = null; return; }
  const { openDebug } = await import('./debug.js');
  window.__closeDebug = openDebug();
});

/* 커리큘럼 */
const stepsEl = document.getElementById('steps');
function renderSteps(track) {
  stepsEl.innerHTML = CURRICULUM[track].map((s, i) => `
    <div class="step">
      <div class="step-no">${String(i + 1).padStart(2, '0')}</div>
      <div>
        <h3>${s.stage}${s.badge ? `<span class="badge">${s.badge}</span>` : ''}</h3>
        <p>${s.title}</p>
      </div>
      ${s.units?.length ? `<div class="scope">${s.units.map(u => `<div>${u}</div>`).join('')}</div>` : '<div></div>'}
    </div>`).join('');
  fitRail();
}
/* 노드 중심 = .step-no 위에서 .34rem+.33rem. rem 을 그대로 읽어 재계산한다 */
function fitRail() {
  const ns = [...stepsEl.querySelectorAll('.step-no')];
  if (ns.length < 2) return;
  const half = parseFloat(getComputedStyle(document.documentElement).fontSize) * 0.67;
  const top = ns[0].offsetTop + half, bot = ns[ns.length - 1].offsetTop + half;
  stepsEl.style.setProperty('--rail-top', `${top}px`);
  stepsEl.style.setProperty('--rail-h', `${bot - top}px`);
}
addEventListener('resize', fitRail);
const tabs = [...document.querySelectorAll('.track')];
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.setAttribute('aria-selected', String(x === t)));
  renderSteps(t.dataset.track);
}));
renderSteps('naesin');

/* 정오표 */
const body = document.getElementById('errata-body');
const stamp = document.getElementById('errata-stamp');

/* 열은 셋이다: 교재 · 날짜 · 다운로드(사용자 지시 2026-07-30).
   정정 내역은 파일 안에 있으므로 화면에 표를 또 펼치지 않는다 — 같은 것을 두 곳에
   두면 어느 쪽이 최신인지 알 수 없게 된다. 파일이 유일한 원본이다.

   열 이름은 비어 있을 때도 나온다 — 헤더가 없으면 "아직 없다" 와 "이 기능이
   없다" 가 구분되지 않는다. 표 뼈대를 두고 몸통만 비운다. */
const THEAD = `
  <thead><tr><th>교재</th><th>날짜</th><th>다운로드</th></tr></thead>`;

if (!ERRATA.length) {
  body.innerHTML = `
    <table class="tbl">${THEAD}
      <tbody><tr><td class="empty" colspan="3">아직 정정 사항이 없습니다.</td></tr></tbody>
    </table>`;
} else {
  const sorted = [...ERRATA].sort((a, b) => b.updated.localeCompare(a.updated));
  stamp.textContent = `최종 갱신 ${sorted[0].updated}`;

  // 14일 이내 수정이면 NEW — 사람이 붙이지 않는다
  const fresh = d => {
    const [y, m, dd] = d.split('.').map(Number);
    return (Date.now() - new Date(2000 + y, m - 1, dd)) / 864e5 <= 14;
  };

  body.innerHTML = `
    <table class="tbl">${THEAD}
      <tbody>
        ${sorted.map(b => `
          <tr>
            <td class="title-cell">${b.title}${fresh(b.updated) ? ' <span class="new">NEW</span>' : ''}</td>
            <td class="num">${b.updated}</td>
            <td>
              <a class="dl" href="${b.file}" download>
                ${(b.file.split('.').pop() || '').toUpperCase()}
              </a>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

/* 채널톡 */
document.querySelectorAll('[data-chat]').forEach(b =>
  b.addEventListener('click', () => openChat(b.dataset.chat)));
</script>
</body>
</html>
