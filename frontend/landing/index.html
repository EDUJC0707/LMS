<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한종철 통합과학 — 히어로 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* ── 시안 전환: ?v=dna-gate 처럼 쿼리로 고른다 ───────────────────── */
  :root{
    --ink:#0B0C0F;          /* 히어로 배경 (시안별로 JS가 덮어씀) */
    --fg:#F4F5F7;
    --muted:#9AA1AC;
    --accent:#C9D4FF;
    --pad: clamp(20px, 4vw, 64px);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--ink); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",
                "Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ── 스크롤 트랙: 이 높이만큼 스크롤하는 동안 히어로가 고정된다 ──── */
  .track{ position:relative; height:250vh; }
  .stage{ position:sticky; top:0; height:100svh; overflow:hidden; }

  /* 레이어 0 — 프레임 시퀀스가 화면 전체를 덮는다 (풀블리드) */
  #seq{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* 레이어 1 — 가독성 스크림.
     시퀀스가 밝아지는 구간에서 우측 텍스트가 묻힌다(유튭 영상도 여기서 터졌다).
     우측에서만 배경색이 배어 나오게 해 좌측 그래픽은 손대지 않는다. */
  .scrim{
    position:absolute; inset:0; pointer-events:none; z-index:1;
    background:linear-gradient(
      100deg,
      transparent 0%, transparent 34%,
      color-mix(in srgb, var(--ink) 55%, transparent) 58%,
      color-mix(in srgb, var(--ink) 82%, transparent) 100%);
  }

  /* 레이어 2 — 그 위에 얹히는 것들 */
  .overlay{
    position:absolute; inset:0; z-index:3; display:grid; align-items:center;
    grid-template-columns: 1fr minmax(300px, 46%);
    padding: 0 var(--pad); gap: var(--pad);
    pointer-events:none;
  }
  .overlay > *{ pointer-events:auto }
  .left{}   /* 그래픽 자리 — 비워둔다. 시퀀스가 여기를 채운다 */

  .right{ max-width:34rem; }
  .eyebrow{
    font-size:.8rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin:0 0 1.1rem;
  }
  h1{
    font-family:"Instrument Serif",serif; font-weight:400;
    font-size:clamp(2.4rem, 5.4vw, 4.4rem); line-height:1.06;
    letter-spacing:-.01em; margin:0 0 1.2rem;
  }
  h1 em{ font-style:italic; color:var(--accent) }
  .sub{ color:var(--muted); font-size:clamp(.95rem,1.3vw,1.08rem); line-height:1.75; margin:0 0 2.2rem }
  .cta{
    display:inline-flex; align-items:center; gap:.6rem;
    padding:.95rem 1.7rem; border-radius:999px;
    background:var(--fg); color:var(--ink);
    font-weight:600; font-size:1rem; text-decoration:none;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .cta:hover{ transform:translateY(-2px); box-shadow:0 10px 30px rgba(0,0,0,.35) }
  .cta span{ transition:transform .18s ease }
  .cta:hover span{ transform:translateX(3px) }

  /* 강사 누끼 — 우측 하단에 세워 시퀀스와 한 장면이 되게 */
  .teacher{
    position:absolute; right:calc(var(--pad) * .2); bottom:0;
    height:min(78svh, 720px); width:auto; object-fit:contain;
    pointer-events:none; z-index:2; opacity:.98;   /* 스크림 위, 텍스트 아래 */
    filter: drop-shadow(0 24px 60px rgba(0,0,0,.55));
  }

  /* sequence-light 전용 — 모티프가 영상이 아니라 DOM이라 형태가 훼손될 수 없다.
     변하는 것은 밝기와 글자뿐이고, 그 값이 스크롤의 순수 함수라 왕복이 대칭이다. */
  .lamps{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    display:none;                      /* 해당 시안에서만 켠다 */
  }
  .lamps.on{ display:block }
  .lamp{
    position:absolute; width:min(26vw,300px); aspect-ratio:1;
    display:grid; place-items:center;
    filter:brightness(var(--b,.25)) saturate(calc(.4 + var(--b,.25) * .8));
    transition:filter .12s linear;
  }
  .lamp img{ width:100%; height:100%; object-fit:contain; display:block }
  .lamp b{
    position:absolute; left:50%; bottom:-2.1rem; transform:translateX(-50%);
    white-space:nowrap; font-size:.82rem; font-weight:600; letter-spacing:.04em;
    color:var(--fg); opacity:calc((var(--b,.25) - .35) * 2.2);
  }
  .lamp:nth-child(1){ left:6%;  top:14% }
  .lamp:nth-child(2){ left:24%; top:38% }
  .lamp:nth-child(3){ left:8%;  top:60% }
  @media (max-width:820px){ .lamp{ width:34vw } .lamp b{ font-size:.7rem } }

  /* 시안 전환 바 (검수용 — 최종본에는 없다) */
  .switch{
    position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:99;
    display:flex; gap:4px; padding:5px; border-radius:999px;
    background:rgba(20,22,28,.72); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);
  }
  .switch a{
    padding:7px 13px; border-radius:999px; text-decoration:none;
    font-size:12px; font-weight:600; color:#C6CBD4; white-space:nowrap;
  }
  .switch a.on{ background:#F4F5F7; color:#14161A }
  @media (max-width:820px){ .switch{ display:none } }

  /* 진행 표시 (검수용) */
  .hud{
    position:fixed; left:12px; bottom:12px; z-index:99;
    font:600 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--muted); background:rgba(0,0,0,.5);
    padding:6px 9px; border-radius:7px; backdrop-filter:blur(6px);
  }

  /* 아래 섹션 — 윤도영식 단순 구성, 더 정갈하게 */
  .after{ padding: clamp(72px,12vh,160px) var(--pad); }
  .after h2{
    font-family:"Instrument Serif",serif; font-weight:400;
    font-size:clamp(1.7rem,3.4vw,2.6rem); margin:0 0 2.6rem;
  }
  .cards{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)) }
  .card{
    border:1px solid rgba(255,255,255,.13); border-radius:16px;
    padding:26px; background:rgba(255,255,255,.02);
  }
  .card h3{ margin:0 0 .5rem; font-size:1.05rem; font-weight:600 }
  .card p{ margin:0; color:var(--muted); font-size:.92rem; line-height:1.7 }

  @media (max-width:820px){
    .track{ height:200vh }
    .overlay{ grid-template-columns:1fr; align-content:end; padding-bottom:12svh }
    .teacher{ height:46svh; right:-6% ; opacity:.5 }
  }
  @media (prefers-reduced-motion:reduce){
    .track{ height:100svh }   /* 스크럽을 끄고 첫 프레임만 */
  }
</style>
</head>
<body>

<section class="track" id="track">
  <div class="stage">
    <canvas id="seq"></canvas>
    <div class="lamps" id="lamps">
      <div class="lamp"><img src="assets/motifs/atom.webp" alt=""><b>개념 · 물질과 규칙성</b></div>
      <div class="lamp"><img src="assets/motifs/dna-2.webp" alt=""><b>약점 · 생명 시스템</b></div>
      <div class="lamp"><img src="assets/motifs/earth-system.webp" alt=""><b>복습 · 지구 시스템</b></div>
    </div>
    <div class="scrim"></div>
    <img class="teacher" id="teacher" alt="한종철 선생님">
    <div class="overlay">
      <div class="left"></div>
      <div class="right">
        <p class="eyebrow" id="eyebrow">2028 수능 · 통합과학</p>
        <h1 id="headline">엉킨 것부터<br><em>푼다</em></h1>
        <p class="sub" id="sub">
          결석하면 직접 연락하고, 틀린 문항은 유사문항으로 다시 냅니다.<br>
          가르치고 끝내지 않는 관리를 확인해 보세요.
        </p>
        <a class="cta" href="#contact">상담 신청하기 <span>→</span></a>
      </div>
    </div>
  </div>
</section>

<section class="after">
  <h2>여기부터는 단순하게</h2>
  <div class="cards">
    <div class="card"><h3>출결 관리</h3><p>결석하면 그날 연락이 갑니다. 보강 영상은 신청 없이 지급됩니다.</p></div>
    <div class="card"><h3>약점 체크</h3><p>틀린 문항에서 유사문항 2개가 자동으로 만들어집니다.</p></div>
    <div class="card"><h3>학부모 리포트</h3><p>성적·출결·과제 검사 결과를 따로 묻지 않아도 받습니다.</p></div>
  </div>
</section>

<div class="hud" id="hud">frame — / —</div>

<script type="module">
import { ScrubSequence } from './scrub.js';

/* 5개 안의 연출별 설정.
   프레임 장수는 build-frames.py가 굽고 frames/manifest.json에 기록한다.
   여기에는 그림으로 표현되지 않는 것 — 배경색·강사사진·카피 — 만 둔다. */
const VARIANTS = {
  'dna-gate': {
    label: '열린 사이로',
    ink: '#05060A', teacher: '01-검정수트-팔짱',
    eyebrow: '2028 수능 · 통합과학',
    headline: '엉킨 것부터<br><em>푼다</em>',
    sub: '결석하면 그날 연락이 갑니다.<br>틀린 문항은 유사문항으로 다시 나옵니다.',
  },
  'sequence-light': {
    label: '순서대로 켜진다',
    lamps: true,                       // 모티프 3개를 DOM으로 얹고 스크롤에 따라 점등
    ink: '#08090C', teacher: '02-검정티-턱손', flipTeacher: true,
    eyebrow: '2028 수능 · 통합과학',
    headline: '순서가 있는<br><em>관리</em>',
    sub: '개념 · 약점 · 복습이 정해진 차례로 켜집니다.<br>빠지는 학생이 없도록.',
  },
  'ruled-layout': {
    label: '누워서 선이 된다',
    ink: '#EDEAE4', light: true, teacher: '03-흰니트-손얼굴',
    eyebrow: '2028 수능 · 통합과학',
    headline: '흩어진 것에<br><em>축을 세운다</em>',
    sub: '무엇을 언제 어디까지 할지 먼저 정합니다.<br>공부는 그다음입니다.',
  },
  'right-angle': {
    label: '각도가 맞으면 읽힌다',
    ink: '#14161A', teacher: '02-검정티-턱손',
    eyebrow: '2028 수능 · 통합과학',
    headline: '못 푸는 게 아니라<br><em>각도가 다른 것</em>',
    sub: '어디서 막히는지 먼저 봅니다.<br>그 지점부터 다시 세웁니다.',
  },
  'pull-back': {
    label: '물러서야 보인다',
    ink: '#EFECE6', light: true, teacher: '01-검정수트-팔짱',
    eyebrow: '2028 수능 · 통합과학',
    headline: '안에 있으면<br><em>안 보인다</em>',
    sub: '전 범위를 한 사람이 통째로 봅니다.<br>방향은 저희가 잡습니다.',
  },
  'test': { label: '엔진 테스트', ink: '#0B0C0F', teacher: '01-검정수트-팔짱', dir: 'rehearsal/frames-test', count: 96 },
};

const key = new URLSearchParams(location.search).get('v') || 'dna-gate';
const V = VARIANTS[key] ?? VARIANTS['dna-gate'];

// 라이트 톤이면 글자·스크림 색을 뒤집는다.
if (V.light) {
  const r = document.documentElement.style;
  r.setProperty('--fg', '#14161A');
  r.setProperty('--muted', '#6A6F78');
  r.setProperty('--accent', '#3A4A8C');
}
document.documentElement.style.setProperty('--ink', V.ink);

const t = document.getElementById('teacher');
t.src = `assets/teacher/nobg/${V.teacher}.webp`;
if (V.flipTeacher) t.style.transform = 'scaleX(-1)';
for (const [id, val] of [['eyebrow', V.eyebrow], ['headline', V.headline], ['sub', V.sub]]) {
  if (val) document.getElementById(id).innerHTML = val;
}

// 시안 전환 바
const bar = document.createElement('nav');
bar.className = 'switch';
bar.innerHTML = Object.entries(VARIANTS)
  .filter(([k]) => k !== 'test')
  .map(([k, v]) => `<a href="?v=${k}" class="${k === key ? 'on' : ''}">${v.label}</a>`).join('');
document.body.appendChild(bar);

const manifest = await fetch('frames/manifest.json').then(r => r.ok ? r.json() : {}).catch(() => ({}));
const meta = manifest[key];
const dir = V.dir ?? `frames/${key}`;
const count = V.count ?? meta?.count;

/* sequence-light: 모티프를 차례로 점등한다.
   구간을 겹치지 않게 나눠 '무작정 다 켜지는 게 아니라 정해진 차례가 있다'가 읽히게 한다.
   조명값이 스크롤의 순수 함수라 역스크롤이 정확히 역순 소등이 된다. */
const lampsEl = document.getElementById('lamps');
const LAMP_SPANS = [[0.00, 0.30], [0.30, 0.60], [0.60, 0.85]];
const DIM = 0.25;
function lightLamps(p) {
  const items = lampsEl.children;
  for (let i = 0; i < items.length; i++) {
    const [a, b] = LAMP_SPANS[i];
    const t = Math.max(0, Math.min(1, (p - a) / (b - a)));
    items[i].style.setProperty('--b', (DIM + (1 - DIM) * t).toFixed(3));
  }
}
if (V.lamps) { lampsEl.classList.add('on'); lightLamps(0); }

const hud = document.getElementById('hud');
if (!count) {
  hud.textContent = `${key} · 프레임 없음 — build-frames.py 실행 필요`;
} else {
  const seq = new ScrubSequence({
    canvas: document.getElementById('seq'),
    track: document.getElementById('track'),
    count,
    src: i => `${dir}/f_${String(i).padStart(3, '0')}.webp`,
    window: 12,
    onProgress: p => {
      const i = Math.round(p * (count - 1));
      hud.textContent = `${key} · frame ${i + 1}/${count} · ${(p * 100).toFixed(0)}%`;
      if (V.lamps) lightLamps(p);
    },
  });
  seq.start();
}
</script>
</body>
</html>
