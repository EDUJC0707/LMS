<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>조절판 — 전체 노브</title>
<style>
  /* 개발용 조절판. index.html 을 iframe 으로 그대로 띄우고 CSS 변수만 건드린다.
     히어로 마크업을 복제하지 않는 이유 — 복제하면 둘이 갈라지고, 그 순간
     여기서 맞춘 값이 실제 화면과 다른 것을 뜻하게 된다. */
  *{box-sizing:border-box;margin:0}
  body{background:#0B0B10;color:#E8E9F2;font:13px/1.5 ui-sans-serif,system-ui,"Apple SD Gothic Neo",sans-serif;display:flex;height:100vh;overflow:hidden}
  /* iframe 은 **항상 1440x900(또는 390x844)로 렌더**하고 transform 으로만 줄인다.
     패널 폭을 뺀 실제 폭으로 렌더하면 vw 단위가 전부 달라져, 여기서 맞춘 값이
     실제 화면에서 틀린 값이 된다. */
  #stage{flex:1;position:relative;overflow:hidden;background:#000}
  iframe{position:absolute;left:0;top:0;border:0;background:#000;transform-origin:0 0}
  #dim{position:absolute;right:8px;bottom:6px;color:#5B5E7E;font:11px ui-monospace,monospace;pointer-events:none}
  aside{width:296px;flex:none;padding:16px;overflow:auto;border-left:1px solid #23243A;background:#0F1018}
  h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7B7FA8;margin:20px 0 10px}
  h2:first-child{margin-top:0}
  label{display:block;margin:12px 0 4px;color:#A9ADD0;font-size:12px}
  .row{display:flex;align-items:center;gap:8px}
  input[type=range]{flex:1;accent-color:#787ED7}
  .val{width:62px;text-align:right;font-variant-numeric:tabular-nums;color:#fff;font-weight:600}
  .sw{display:grid;grid-template-columns:1fr;gap:6px}
  .sw button{
    display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
    border:1px solid #23243A;background:#14151F;color:#D6D8EC;cursor:pointer;
    font:inherit;text-align:left;
  }
  .sw button[aria-pressed=true]{border-color:#787ED7;background:#1B1C2C}
  .sw i{width:15px;height:15px;border-radius:4px;flex:none}
  .sw b{font-weight:700}
  .sw small{color:#7B7FA8;margin-left:auto;font-variant-numeric:tabular-nums}
  pre{
    margin-top:12px;padding:10px;border-radius:9px;background:#08080D;border:1px solid #23243A;
    color:#9FA3C8;font:11px/1.6 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;
  }
  .note{color:#6E7296;font-size:11px;line-height:1.6;margin-top:8px}
  .seg{display:flex;gap:6px;margin-bottom:10px}
  .seg button{flex:1;padding:6px;border-radius:8px;border:1px solid #23243A;background:#14151F;color:#A9ADD0;cursor:pointer;font:inherit}
  .seg button[aria-pressed=true]{border-color:#787ED7;color:#fff}
</style>
</head>
<body>
<div id="stage"><iframe id="f" src="index.html"></iframe><div id="dim"></div></div>
<aside>
  <div class="seg">
    <button data-w="1440" aria-pressed="true">데스크탑</button>
    <button data-w="390">모바일</button>
  </div>
  <button id="reset" style="width:100%;margin-bottom:10px;padding:7px;border-radius:8px;border:1px solid #23243A;background:#14151F;color:#A9ADD0;cursor:pointer;font:inherit">초기값으로</button>

  <h2>강사</h2>
  <label>높이 <span id="lh"></span></label>
  <div class="row"><input id="h" type="range" min="20" max="100" step="1"><span class="val" id="hv"></span></div>
  <label>오른쪽에서 <span id="lr"></span></label>
  <div class="row"><input id="r" type="range" min="-30" max="40" step="1"><span class="val" id="rv"></span></div>

  <h2>먼지</h2>
  <div id="dustCtl"></div>

  <h2>바람</h2>
  <div id="windCtl"></div>

  <h2>블루</h2>
  <div class="sw" id="sw"></div>

  <h2>지금 값</h2>
  <pre id="out"></pre>
  <pre id="cfgOut"></pre>
  <p class="note">강사를 옮기면 모티프 금지선이 같이 움직인다. 값을 정하고 나서
  <b>pack-layout.py</b> 를 다시 돌려야 배치가 맞는다 — 아래 경계값을 그대로 쓰면 된다.</p>
</aside>

<script type="module">
/* 팔레트 6종. 전부 에셋에서 나온 청색계이고, 색상각(H)과 채도만 다르다.
   에셋 심부 평균이 H236 이라 그걸 가운데 두고 양옆으로 벌렸다.
   각 항목의 accent 휘도를 132 근처로 맞춰 놨다 — 밝기가 제각각이면
   "어떤 파랑이 예쁜가"가 아니라 "어떤 게 밝은가"를 고르게 된다. */
const PALETTES = [
  { key:'asset',    name:'에셋 심부',   h:236, note:'atom·synapse·universe 실측',
    dim:'#666999', accent:'#787ED7', glow:'#A5A9DD', chip:'#131427', t1:'#676BA1', t2:'#F0F1FA' },
  { key:'indigo',   name:'인디고',      h:248, note:'보라 쪽으로',
    dim:'#6A6699', accent:'#8578DB', glow:'#ADA5DF', chip:'#151327', t1:'#6D67A3', t2:'#F2F0FA' },
  { key:'royal',    name:'로열',        h:224, note:'정통 네이비',
    dim:'#5E6B9C', accent:'#6B87DE', glow:'#9EAEE1', chip:'#101729', t1:'#606DA4', t2:'#EEF1FA' },
  { key:'electric', name:'일렉트릭',    h:212, note:'가장 선명·차갑다',
    dim:'#557099', accent:'#5290E0', glow:'#93B4E2', chip:'#0C1A29', t1:'#5673A4', t2:'#ECF2FA' },
  { key:'ice',      name:'아이스',      h:200, note:'채도 낮은 청록 쪽',
    dim:'#587490', accent:'#54A0D4', glow:'#95BCD8', chip:'#0B1B26', t1:'#59769B', t2:'#EBF3FA' },
  { key:'steel',    name:'스틸',        h:230, note:'채도 절반 — 가장 차분',
    dim:'#6B6E85', accent:'#8288B4', glow:'#A8ACC6', chip:'#15161F', t1:'#6E7191', t2:'#F0F0F5' },
];

const f = document.getElementById('f');
const $ = id => document.getElementById(id);
let mobile = false, pal = PALETTES[0];
let H = 73, R = 9;            // index.html 의 현재 데스크탑 값(초기화 상태)
let Hs = 36, Rs = -14;        // 모바일 값

const sw = $('sw');
PALETTES.forEach(p => {
  const b = document.createElement('button');
  b.innerHTML = `<i style="background:${p.accent}"></i><b>${p.name}</b><small>H${p.h}</small>`;
  b.title = p.note;
  b.onclick = () => { pal = p; paint(); };
  b.dataset.key = p.key;
  sw.append(b);
});

function doc() { return f.contentDocument; }

function paint() {
  const d = doc(); if (!d) return;
  const s = d.documentElement.style;
  s.setProperty('--teacher-h', H + 'svh');
  s.setProperty('--teacher-right', R + '%');
  s.setProperty('--teacher-h-sm', Hs + 'svh');
  s.setProperty('--teacher-right-sm', Rs + '%');
  for (const k of ['dim', 'accent', 'glow', 'chip', 't1', 't2']) s.setProperty('--' + k, pal[k]);
  // --line 은 accent 에서 파생한다 — 두 값이 어긋나면 테두리만 다른 파랑이 된다
  const [rr, gg, bb] = [1, 3, 5].map(i => parseInt(pal.accent.substr(i, 2), 16));
  s.setProperty('--line', `rgba(${rr},${gg},${bb},.26)`);

  [...sw.children].forEach(b => b.setAttribute('aria-pressed', b.dataset.key === pal.key));
  $('hv').textContent = (mobile ? Hs : H) + 'svh';
  $('rv').textContent = (mobile ? Rs : R) + '%';

  // 강사 왼쪽 경계 — pack-layout.py 가 금지선으로 쓰는 값
  const img = d.querySelector('.teacher');
  const vw = mobile ? 390 : 1440;
  const edge = img ? (img.getBoundingClientRect().left / vw * 100).toFixed(0) : '?';

  $('out').textContent =
`.teacher{ right:${R}%; height:min(${H}svh, ${Math.round(900 * H / 100)}px) }
@media(max-width:860px){ .teacher{ height:${Hs}svh; right:${Rs}% } }

--dim:${pal.dim}  --accent:${pal.accent}
--glow:${pal.glow}  --chip:${pal.chip}
--t1:${pal.t1}  --t2:${pal.t2}

pack-layout.py:
  TEACHER_H     = ${(mobile ? Hs : H) / 100}
  TEACHER_RIGHT = ${(mobile ? Rs : R) / 100}
  → 강사 왼쪽 경계 ${edge}%`;
}

$('h').oninput = e => { const v = +e.target.value; mobile ? Hs = v : H = v; paint(); };
$('r').oninput = e => { const v = +e.target.value; mobile ? Rs = v : R = v; paint(); };

/* 먼지·바람은 CSS 변수로 뺄 수 없다(개수·물리 상수라서). field.js 가 노출한
   window.__field 훅으로 직접 만진다. 개수만 재생성이 필요하고 나머지는 즉시 반영된다. */
const DUST = [
  ['dust',    '개수',     200, 4000, 50,  true],
  ['dMin',    '최소 크기', 0.5, 4,    .1],
  ['dMax',    '최대 크기', 0.5, 6,    .1],
  ['aMin',    '최소 밝기', 0.01, .4,  .01],
  ['aMax',    '최대 밝기', 0.02, .6,  .01],
  ['twinkle', '반짝임',   0,    1,    .05],
  ['home',    '부유 반경', 0,    30,   1],
];
const WIND = [
  ['R',     '창 반경(화면비)', .05, .40, .01],
  ['push',  '밀어냄',          0,   2,   .05],
  ['sweep', '진행 쓸림',       0,   .6,  .02],
  ['swirl', '소용돌이',        0,   .8,  .02],
  ['fade',  '옅어짐',          0,   1,   .05],
  ['kIn',   '되메움 속도',     .3,  6,   .1],
];

function buildCtl(host, spec) {
  for (const [key, label, min, max, step, needsRebuild] of spec) {
    const wrap = document.createElement('div');
    const lab = document.createElement('label');
    lab.textContent = label;
    const row = document.createElement('div'); row.className = 'row';
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step;
    const out = document.createElement('span'); out.className = 'val';
    inp.oninput = () => {
      const api = doc()?.defaultView?.__field; if (!api) return;
      api.cfg[key] = +inp.value;
      out.textContent = inp.value;
      if (needsRebuild) api.rebuild(+inp.value);
      else if (key === 'R') api.refit();          // 창 반경은 fit 에서 픽셀로 환산된다
      // aMin/aMax/dMin/dMax 는 입자 생성 시점 값이라 다시 만들어야 반영된다
      if (key[0] === 'a' || key[0] === 'd') api.rebuild();
      dumpCfg();
    };
    inp.dataset.key = key;
    row.append(inp, out);
    wrap.append(lab, row);
    host.append(wrap);
  }
}
buildCtl($('dustCtl'), DUST);
buildCtl($('windCtl'), WIND);

function syncCtl() {
  const api = doc()?.defaultView?.__field; if (!api) return;
  document.querySelectorAll('#dustCtl input,#windCtl input').forEach(i => {
    i.value = api.cfg[i.dataset.key];
    i.nextElementSibling.textContent = i.value;
  });
}

function dumpCfg() {
  const api = doc()?.defaultView?.__field; if (!api) return;
  const c = api.cfg;
  $('cfgOut').textContent =
    `dust:${c.dust}  dMin:${c.dMin} dMax:${c.dMax}\n` +
    `aMin:${c.aMin} aMax:${c.aMax}  twinkle:${c.twinkle}  home:${c.home}\n` +
    `R:${c.R}  push:${c.push}  sweep:${c.sweep}\n` +
    `swirl:${c.swirl}  fade:${c.fade}  kIn:${c.kIn}`;
}

/* iframe 은 항상 실제 뷰포트 크기로 렌더하고 transform 으로만 축소한다.
   패널 폭을 뺀 크기로 렌더하면 vw 단위가 전부 달라져, 여기서 맞춘 값이 실제
   화면에서는 틀린 값이 된다. */
const stage = document.getElementById('stage');
function layout() {
  const [vw, vh] = mobile ? [390, 844] : [1440, 900];
  const k = Math.min(stage.clientWidth / vw, stage.clientHeight / vh);
  f.style.width = vw + 'px';
  f.style.height = vh + 'px';
  f.style.transform = `translate(${(stage.clientWidth - vw * k) / 2}px,${(stage.clientHeight - vh * k) / 2}px) scale(${k})`;
  document.getElementById('dim').textContent = `${vw}x${vh} · ${(k * 100).toFixed(0)}%`;
}
addEventListener('resize', layout);

document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  mobile = b.dataset.w === '390';
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  layout();
  sync();
});

function sync() {
  $('h').value = mobile ? Hs : H;
  $('r').value = mobile ? Rs : R;
  paint();
  syncCtl();
  dumpCfg();
}
/* 초기값 = field.js·index.html 에 박혀 있는 값. iframe 을 새로 띄우면 그게 곧
   초기 상태이므로 리로드가 가장 정확한 초기화다. */
document.getElementById('reset').onclick = () => {
  H = 73; R = 9; Hs = 36; Rs = -14; pal = PALETTES[0];
  f.contentWindow.location.reload();
};

f.addEventListener('load', () => { layout(); sync(); });
layout();
if (doc()?.readyState === 'complete') sync();
</script>
</body>
</html>
