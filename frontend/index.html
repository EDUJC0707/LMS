<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#194f81" />
    <link rel="icon" type="image/png" href="/atom-logo.png" />
    <!-- 본문·제목용 한국어 가변 폰트. 라틴 전용 페이스는 한글에서 시스템 폰트로
         떨어지므로 UI 전면은 SUIT 하나로 간다(display+body 겸용).
         SUIT 선택 이유(2026-07-28): 이 앱은 화면 절반이 숫자(원번·점수·금액·D-n)인데
         SUIT 의 기하학적 정원형 0·ㅇ 과 넉넉한 자간이 그 숫자들을 가장 잘 세운다.
         Pretendard 는 system-ui 대체가 목적이라 "보이지 않는 것"이 설계 목표였고,
         그래서 네이비 미니멀이 요구하는 공기감을 만들지 못했다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css"
    />
    <!-- 아웃라이어(2곳 한정): 로고 태그 'LMS' + 숫자/코드 레지스터(점수·학번·시각). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <title>한종철 통합과학 LMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
