# 로컬 개발용 인프라 — PostgreSQL + Redis 만 띄운다.
# (backend/frontend 는 호스트에서 uv/npm 으로 직접 실행)
#
# 포트는 반드시 `127.0.0.1:` 을 붙여 공개한다. 접두사를 빼면 도커가 0.0.0.0 에
# 바인딩해 **같은 와이파이의 아무나 붙을 수 있다** — 2026-08-06 실측으로
# 192.168.x 에서 5432·6379 가 둘 다 열려 있었다. 비밀번호는 이 파일에 그대로
# 적혀 있고(로컬 전용이라 그래도 된다) 레디스는 무인증이며, 그 뒤에 학생 30명의
# 실명·전화가 들어 있다. 맥 방화벽은 기본으로 꺼져 있어 막아 주지 않는다.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
