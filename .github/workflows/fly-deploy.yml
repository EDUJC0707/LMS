name: fly deploy
on:
  push:
    branches: [main]
  # 손으로도 돌릴 수 있어야 한다 — 토큰·시크릿을 갈아 끼운 뒤 확인하려고
  # 의미 없는 커밋을 밀 수는 없다.
  workflow_dispatch:
jobs:
  # 배포 전에 테스트가 돈다(2026-08-19). 그전에는 이 워크플로가 checkout·flyctl·
  # deploy 셋뿐이라 **어떤 회귀도 CI 에서 안 걸렸다.**
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # GIT_SHA 는 Sentry 의 release 태그가 된다(infra/Dockerfile 3번 절).
      # 안 넘기면 배포는 성공하지만 에러에 배포 식별자가 안 붙는다 — 조용히 실패한다.
      - run: flyctl deploy -c infra/fly.toml --remote-only --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
