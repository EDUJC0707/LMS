# Fly.io 배포 설정 — 도쿄(nrt) 리전.
# 배포 전: (1) app 이름을 실제 이름으로 교체 (2) 비밀은 `fly secrets set` 으로 주입
#   (DJANGO_SECRET_KEY, DATABASE_URL, REDIS_URL, CELERY_BROKER_URL, AWS_*, SENTRY_DSN 등).

app = "edujc-lms"          # LMS 백엔드 앱. (문제툴은 별도 레포/앱 edujc-qbank)
primary_region = "nrt"     # 도쿄

[build]
  # fly.toml 위치(infra/) 기준 상대경로. 빌드 컨텍스트는 실행 위치(레포 루트).
  dockerfile = "Dockerfile"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.prod"
  PORT = "8000"

# 배포마다 1회 실행(웹/워커 교체 전) — DB 마이그레이션. Postgres attach 후부터 성공.
# .venv 바이너리 직접 실행(=uv run 재동기화/다운로드 회피 → 빠른 부팅).
[deploy]
  release_command = ".venv/bin/python manage.py migrate --noinput"

# 프로세스 그룹. .venv 바이너리 직접 실행 — uv run 이 부팅마다 dev deps 재설치/
# 바이트컴파일하는 지연 제거.
#
# **worker(celery) 는 뺐다**(2026-07-29). 뺄 당시 이 저장소에 @shared_task 가 하나도 없고,
# 부르는 곳도 beat 스케줄도 없다. 게다가 REDIS_URL/CELERY_BROKER_URL 시크릿이 없어
# localhost:6379 로 붙으려다 32초마다 접속 실패 로그만 찍고 있었다.
# 하는 일 없이 월 $3.32 였다.
#
# **(1) 은 2026-08-04 에 충족됐다** — `apps/clinic/tasks.py` 가 첫 태스크이고
# beat 일정도 `CELERY_BEAT_SCHEDULE` 에 선언돼 있다(20분 주기, 클리닉 감독 자료
# 수집). 그런데도 아직 안 켠다: **배포는 보류**(2026-08-04 사용자 지시).
# 그동안 그 일은 `manage.py collect_clinic_supervision` 로 손으로 돌린다.
#
# 되살릴 때: 아래 줄을 풀기 전에 (2) Redis 프로비저닝 + 시크릿 주입이 먼저다.
# 순서가 반대면 또 에러만 찍는 머신이 선다.
#   fly redis create                      # Upstash 연동
#   fly secrets set REDIS_URL=... CELERY_BROKER_URL=... -a edujc-lms
#
# ── beat 를 워커에서 뺐다 (2026-08-19) ───────────────────────────────────
# ~~`-B` 로 beat 를 워커 안에 넣는다~~ → **분리했다.**
#
# 합쳐 둔 이유는 프로세스 그룹마다 머신이 하나씩 서서 월 $3.32 가 두 번 나가기
# 때문이었다. 그 대가가 둘이다:
#
# - **워커가 1대에 묶인다.** 2대로 늘리는 순간 두 머신이 같은 시각에 같은 작업을
#   발행한다. `fly scale count worker=2` 를 못 누른다는 뜻이다
# - **워커가 죽으면 스케줄러도 같이 죽는다.** 판독 태스크가 멎어 자식이 통째로
#   나가면 주기 작업이 조용히 멈추고, 아무도 그걸 모른다
#
# 둘째가 실제 위험이다 — OMR 배치가 워커에 올라온 뒤로는 워커가 무거운 일을 하는
# 프로세스가 됐다. beat 는 DB 조회 한 번씩만 하는 가벼운 프로세스라 같이 죽을
# 이유가 없다.
#
# beat 를 빠뜨리면 태스크는 등록돼 있는데 아무도 부르지 않아 조용히 안 돈다.
# **beat 는 반드시 1대여야 한다** — `fly scale count beat=1` 을 넘기지 말 것.
#
# ── supercronic → Celery 로 옮겨 탔다 (2026-08-12) ────────────────────────
# ~~주기 작업은 supercronic 이 맡는다(2026-08-05)~~ → **뒤집혔다.**
#
# 그때 판단의 전제는 *"떠넘길 웹 요청이 없다"* 였다. 이제 있다 — 결제 취소가
# 요청 안에서 알림을 걸고(`payments.payment_admin`), 그 뒤로 8-17 트리거들이
# 줄줄이 붙는다. 브로커 없이는 **요청 스레드가 발송을 직접 물고 있어야** 한다.
#
# 값은 그때 계산한 그대로다: Redis 정액 250MB $10/월 + 워커 머신 약 $2.
# **종량제를 쓰지 않는다** — Upstash 문서가 "Celery 는 큐가 비어도 계속 폴링해서
# 종량제에서 비용이 커진다"고 명시한다(2026-08-12 에 종량제로 만들었다가 이 줄을
# 읽고 정액으로 다시 만들었다).
#
# **supercronic 은 걷어냈다.** `crontab` 의 클리닉 수집이 `CELERY_BEAT_SCHEDULE`
# 에 같은 20분 주기로 또 있어서, 둘을 같이 두면 같은 작업이 두 번 돈다
# (멱등이라 사고는 아니지만 구글 API 를 두 배로 부른다).
[processes]
  web = ".venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
  # gossip·mingle·heartbeat 는 워커끼리 서로를 찾는 잡담이다. 워커가 하나뿐이라
  # 할 상대가 없는데 Redis 명령만 계속 먹는다 — 정액제라도 끄는 편이 조용하다.
  worker = ".venv/bin/celery -A config worker -l info --without-gossip --without-mingle --without-heartbeat"
  # beat 는 스케줄만 발행한다. 동시성·시간 제한은 워커 쪽 설정이라 여기 없다.
  beat = ".venv/bin/celery -A config beat -l info"

# 워커 크기는 아래 [[vm]] 이 web 과 함께 정한다(512mb). 여기 256mb 로 따로 잡았다가
# 아래 블록에 밀렸다 — Django + Celery 를 올리면 256mb 는 빠듯해서 그대로 둔다.
#
# 워커 동시성·시간 제한·메모리 상한은 **명령줄이 아니라 설정에 있다**
# (`config/settings/base.py` 의 CELERY_WORKER_* / CELERY_TASK_*_TIME_LIMIT).
# 두 군데에 적으면 반드시 한쪽만 고치는 날이 온다.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # 수업시간대(평일 저녁 등) 콜드스타트 방지를 위해 web 은 최소 1대 웜 유지.
  # 트래픽 패턴에 맞춰 `fly scale count web=N` 또는 스케줄 스케일링으로 조정.
  min_machines_running = 1
  processes = ["web"]

  # 한 머신이 동시에 받을 양. **기본값은 soft 20 / hard 없음**이라, 설정하지 않으면
  # 머신이 "그만 받겠다"고 말할 수단이 없다 — 20을 넘어도 계속 받아 큐만 쌓이고,
  # gunicorn 워커 3개가 다 물리면 전체가 멈춘다.
  # 지금 워커는 sync 3개라 진짜 동시 처리량이 3이다. soft 6에서 분산을 시작하고
  # hard 12에서 끊는다 — 넘치면 느려지다 죽는 대신 빨리 실패한다.
  [http_service.concurrency]
    type       = "requests"
    soft_limit = 6
    hard_limit = 12

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "20s"
    timeout = "5s"
    grace_period = "40s"   # 첫 부팅(psycopg/celery import 등) 여유

    # 헬스체크는 사설망으로 머신에 직접 붙어서 Host 가 **사설 IPv6 리터럴**이 된다.
    # `ALLOWED_HOSTS` 를 `*` 에서 실제 도메인으로 좁히는 순간 그 Host 가 걸려
    # Django 가 400 을 내고, 체크가 실패해 머신이 통째로 트래픽에서 빠진다.
    # 체크에만 Host 를 박아 두면 좁힌 목록에 사설 주소를 넣지 않아도 된다.
    [http_service.checks.headers]
      Host = "api.hjcedu.com"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web", "worker"]

# beat 는 스케줄을 발행만 한다 — 20분·1시간·1분 주기로 DB 를 한 번씩 볼 뿐이다.
# 워커와 같은 512mb 를 줄 이유가 없다.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["beat"]
