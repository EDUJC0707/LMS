[project]
name = "lms-backend"
version = "0.1.0"
description = "한종철 LMS 백엔드 (Django + DRF + Celery)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "celery>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "django-storages[s3]>=1.14",
    "gunicorn>=23.0",
    "sentry-sdk>=2.14",
    # Mux signed playback — RS256 JWT 서명(cryptography 가 RSA 백엔드)
    "pyjwt[crypto]>=2.9",
]

# 개발 전용 의존성 (uv sync --no-dev 로 운영 이미지에서는 제외)
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
    # 타입 검사 — django-stubs 없이 pyright 를 켜면 Model.objects·역참조 매니저에서
    # 가짜 에러가 쏟아진다(2026-07-29 실측: 1212건 중 1073건이 그것). 스텁이
    # 있어야 비로소 진짜 오류가 보인다.
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
]

# 이 프로젝트는 배포 가능한 라이브러리가 아니라 애플리케이션이므로
# 빌드 백엔드 없이 의존성만 관리한다(uv sync 로 .venv 구성).
[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# 마이그레이션은 자동 생성물 — 손편집하지 않으므로 포맷 규칙에서 제외.
"**/migrations/*" = ["E501", "I001"]
