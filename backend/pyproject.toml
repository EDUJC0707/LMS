[project]
name = "lms-backend"
version = "0.1.0"
description = "한종철 LMS 백엔드 (Django + DRF + Celery)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "celery>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "django-storages[s3]>=1.14",
    "gunicorn>=23.0",
    "sentry-sdk>=2.14",
]

# 개발 전용 의존성 (uv sync --no-dev 로 운영 이미지에서는 제외)
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

# 이 프로젝트는 배포 가능한 라이브러리가 아니라 애플리케이션이므로
# 빌드 백엔드 없이 의존성만 관리한다(uv sync 로 .venv 구성).
[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ"]
